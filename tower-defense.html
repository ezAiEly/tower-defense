// ═══════════ 过程化音效引擎 (Web Audio API) ═══════════
const AudioFX = (function() {
  let ctx = null;
  function getCtx() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, type, duration, vol) {
    const c = getCtx(); if (!c) return;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + (duration || 0.12));
    osc.connect(gain); gain.connect(c.destination);
    osc.start(c.currentTime); osc.stop(c.currentTime + (duration || 0.12) + 0.01);
  }
  function noise(duration, vol, filterFreq) {
    const c = getCtx(); if (!c) return;
    const len = Math.floor(c.sampleRate * (duration || 0.1));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const gain = c.createGain();
    gain.gain.setValueAtTime(vol || 0.08, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + (duration || 0.1));
    if (filterFreq) {
      const filt = c.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = filterFreq;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = filterFreq * 2.5;
      src.connect(filt); filt.connect(lp); lp.connect(gain);
    } else { src.connect(gain); }
    gain.connect(c.destination);
    src.start(c.currentTime); src.stop(c.currentTime + (duration || 0.1) + 0.01);
  }
  return {
    place() { tone(500, 'square', 0.1, 0.06); tone(750, 'square', 0.07, 0.04); },
    shoot(type) {
      switch(type) {
        case 'arrow': tone(1400, 'sine', 0.07, 0.03); break;
        case 'cannon': noise(0.18, 0.1, 180); tone(70, 'sawtooth', 0.14, 0.06); break;
        case 'ice': tone(2200, 'sine', 0.1, 0.03); tone(1800, 'sine', 0.12, 0.025); break;
        case 'lightning': noise(0.1, 0.08, 3500); tone(350, 'sawtooth', 0.07, 0.05); break;
        case 'poison': noise(0.12, 0.05, 900); break;
        case 'barracks': tone(350, 'square', 0.12, 0.05); break;
        case 'sniper': noise(0.25, 0.13, 120); tone(50, 'sawtooth', 0.2, 0.08); break;
        case 'flame': noise(0.2, 0.1, 350); break;
        case 'aura': tone(440, 'sine', 0.4, 0.04); tone(660, 'sine', 0.3, 0.03); break;
        default: tone(800, 'sine', 0.05, 0.04); break;
      }
    },
    hit(type) {
      if (type === 'physical') noise(0.04, 0.05, 700);
      else if (type === 'magic') { tone(300, 'sine', 0.05, 0.04); tone(500, 'sine', 0.04, 0.025); }
      else noise(0.03, 0.04, 1000);
    },
    explosion() { noise(0.35, 0.14, 80); tone(35, 'sawtooth', 0.3, 0.08); },
    death() { noise(0.12, 0.07, 250); tone(180, 'sawtooth', 0.08, 0.03); },
    waveStart() { tone(330, 'triangle', 0.25, 0.06); tone(440, 'triangle', 0.2, 0.05); tone(550, 'triangle', 0.18, 0.04); },
    gameOver() { tone(180, 'sawtooth', 0.5, 0.09); tone(130, 'sawtooth', 0.4, 0.07); tone(80, 'sawtooth', 0.6, 0.1); },
    victory() { tone(523, 'sine', 0.12, 0.06); tone(659, 'sine', 0.12, 0.06); tone(784, 'sine', 0.12, 0.06); tone(1047, 'sine', 0.2, 0.08); },
    sell() { tone(300, 'triangle', 0.1, 0.05); },
    upgrade() { tone(700, 'sine', 0.07, 0.04); tone(900, 'sine', 0.08, 0.05); tone(1100, 'sine', 0.07, 0.04); },
  };
})();

// ═══════════ 对象池 (减少GC压力) ═══════════
const ObjectPool = (function() {
  const _pools = {};
  const MAX_POOL = 500;
  function _get(k) { if (!_pools[k]) _pools[k] = []; return _pools[k]; }
  return {
    acquire(type) { const p = _get(type); return p.length > 0 ? p.pop() : null; },
    release(type, obj) {
      if (!obj) return;
      const p = _get(type);
      if (p.length < MAX_POOL) { for (const k in obj) delete obj[k]; p.push(obj); }
    },
    clear() { for (const k in _pools) delete _pools[k]; },
  };
})();

// ═══════════ 网格与路径 ═══════════
function generatePathCells(waypoints) {
  const cells = [{col: waypoints[0].col, row: waypoints[0].row}];
  for (let i = 0; i < waypoints.length - 1; i++) {
    const a = waypoints[i];
    const b = waypoints[i + 1];
    if (a.col === b.col) {
      const step = b.row > a.row ? 1 : -1;
      for (let r = a.row + step; r !== b.row + step; r += step) {
        cells.push({col: a.col, row: r});
      }
    } else {
      const step = b.col > a.col ? 1 : -1;
      for (let c = a.col + step; c !== b.col + step; c += step) {
        cells.push({col: c, row: a.row});
      }
    }
  }
  return cells;
}

function initGrid() {
  gameState.grid = [];
  gameState._spatialGrid = {};  // spatial hash for enemy lookups
  gameState._terrainTypes = [];   // per-cell terrain variant
  gameState._decorations = [];    // placed decor objects
  for (let row = 0; row < GRID_ROWS; row++) {
    gameState.grid[row] = new Array(GRID_COLS).fill(0);
    gameState._terrainTypes[row] = new Array(GRID_COLS).fill(0);
  }
  for (let pi = 0; pi < gameState.paths.length; pi++) {
    for (const cell of gameState.paths[pi].cells) {
      if (gameState.grid[cell.row][cell.col] === 0) {
        gameState.grid[cell.row][cell.col] = pi + 1;
      }
    }
  }
  // Collect all unique path cells
  const cellSet = new Set();
  gameState.allPathCells = [];
  for (const path of gameState.paths) {
    for (const cell of path.cells) {
      const key = cell.row * 100 + cell.col;
      if (!cellSet.has(key)) {
        cellSet.add(key);
        gameState.allPathCells.push(cell);
      }
    }
  }
  // Generate terrain variety for non-path cells
  const seededRandom = (function(seed) {
    return function() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  })(42);
  for (let row = 0; row < GRID_ROWS; row++) {
    for (let col = 0; col < GRID_COLS; col++) {
      if (gameState.grid[row][col] === 0) {
        gameState._terrainTypes[row][col] = Math.floor(seededRandom() * 5); // 0-4 grass variants
        // Place decorations on ~28% of empty cells
        if (seededRandom() < 0.28) {
          let accum = 0;
          const totalW = TERRAIN_DECOR.reduce((s, d) => s + d.weight, 0);
          let roll = seededRandom() * totalW;
          let chosen = TERRAIN_DECOR[0];
          for (const d of TERRAIN_DECOR) {
            accum += d.weight;
            if (roll <= accum) { chosen = d; break; }
          }
          gameState._decorations.push({
            col, row,
            emoji: chosen.emoji,
            scale: chosen.scale * (0.8 + seededRandom() * 0.4),
            offsetX: (seededRandom() - 0.5) * 8,
            offsetY: (seededRandom() - 0.5) * 8,
          });
        }
      }
    }
  }
}

function buildPaths() {
  gameState.paths = PATH_DEFS.map(def => {
    const cells = generatePathCells(def.waypoints);
    const pixels = cells.map(c => gridToPixel(c.col, c.row));
    return { name: def.name, color: def.color, cells, pixels };
  });
}

// ═══════════ 辅助函数 ═══════════
function gridToPixel(col, row) {
  return {
    x: MAP_X + col * CELL_SIZE + CELL_SIZE / 2,
    y: MAP_Y + row * CELL_SIZE + CELL_SIZE / 2,
  };
}

function pixelToGrid(px, py) {
  const col = Math.floor((px - MAP_X) / CELL_SIZE);
  const row = Math.floor((py - MAP_Y) / CELL_SIZE);
  if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) return null;
  return {col, row};
}

function dist(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}
function distSq(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return dx * dx + dy * dy;
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

// Level structure: indices 0=L1, 1-2=L2 branches, 3-6=L3 branches, 7-10=L4 ultimates
// Use getTowerLevelConfig() instead of direct array indexing
function getTowerLevelConfig(tower) {
  const idx = tower._lvlIdx || 0;
  const levels = TOWER_CONFIG[tower.type].levels;
  return levels[Math.min(idx, levels.length - 1)] || levels[0];
}

// Find level by name (safer than index-based lookup)
function findLevelByName(towerType, name) {
  const levels = TOWER_CONFIG[towerType].levels;
  for (let i = 0; i < levels.length; i++) {
    if (levels[i].name === name) return i;
  }
  return -1;
}
function getTowerVisualLevel(tower) {
  const idx = tower._lvlIdx || 0;
  if (idx === 0) return 1;
  if (idx === 1 || idx === 2) return 2;
  if (idx >= 7) return 4;
  return 3;
}
// Returns 0=no branch, 1=branch A (idx 3,4,7,8), 2=branch B (idx 5,6,9,10)
function getTowerBranch(tower) {
  const idx = tower._lvlIdx || 0;
  if (idx <= 2) return 0;
  if (idx === 3 || idx === 4 || idx === 7 || idx === 8) return 1;
  return 2;
}

function getEnemyHp(type, wave) {
  const cfg = ENEMY_CONFIG[type];
  return cfg.hpBase + wave * cfg.hpScale;
}

// ═══════════ 科技树辅助函数 ═══════════
function getTechLevel(branch, nodeId) {
  return gameState.tech[branch][nodeId] || 0;
}
function setTechLevel(branch, nodeId, lv) {
  gameState.tech[branch][nodeId] = lv;
}
function getBranchTotal(branch) {
  let t = 0;
  for (const k in gameState.tech[branch]) t += gameState.tech[branch][k];
  return t;
}
// ── 科技加成缓存（避免每帧重复遍历54个节点）──
const _techBonusCache = {};
function invalidateTechCache() { for (const k in _techBonusCache) delete _techBonusCache[k]; }
function getTechBonus(effect) {
  if (effect in _techBonusCache) return _techBonusCache[effect];
  let total = 0;
  for (const br of ['A','B','C']) {
    const cfg = TECH_CONFIG.branches[br];
    for (const nid in cfg.nodes) {
      const n = cfg.nodes[nid];
      if (n.eff === effect) {
        total += (gameState.tech[br][nid] || 0) * n.val;
      }
    }
  }
  const combos = TECH_CONFIG.branches.combos;
  if (combos && combos.length) {
    for (let i = 0; i < combos.length; i++) {
      const c = combos[i];
      if (c.eff === effect) {
        total += (gameState.tech.combos[c.id] || 0) * c.val;
      }
    }
  }
  _techBonusCache[effect] = total;
  return total;
}
function canUpgradeTechNode(branch, nodeId) {
  const cfg = TECH_CONFIG.branches[branch];
  if (!cfg || !cfg.nodes) {
    // Combo node check
    const combo = TECH_CONFIG.branches.combos.find(function(c){return c.id === nodeId;});
    if (!combo) return false;
    return canUpgradeComboNode(combo);
  }
  const node = cfg.nodes[nodeId];
  if (!node) return false;
  const curLv = getTechLevel(branch, nodeId);
  if (curLv >= node.max) return false;
  const cost = TECH_CONFIG.costs[curLv];
  if (gameState.techPoints < cost) return false;
  // Check prerequisites within the same branch
  for (const preId in node.pre) {
    if (getTechLevel(branch, preId) < node.pre[preId]) return false;
  }
  return true;
}
function canUpgradeComboNode(combo) {
  const curLv = gameState.tech.combos[combo.id] || 0;
  if (curLv >= combo.max) return false;
  const cost = TECH_CONFIG.costs[curLv];
  if (gameState.techPoints < cost) return false;
  // Check branch total requirements
  for (const br in combo.req) {
    if (getBranchTotal(br) < combo.req[br]) return false;
  }
  // Check pre-combo requirement (must be maxed)
  if (combo.preCombo) {
    const preComboCfg = TECH_CONFIG.branches.combos.find(function(c) { return c.id === combo.preCombo; });
    const requiredLv = preComboCfg ? preComboCfg.max : 2;
    if ((gameState.tech.combos[combo.preCombo] || 0) < requiredLv) return false;
  }
  return true;
}
function upgradeTechNode(branch, nodeId) {
  const isCombo = (branch === 'combos');
  if (isCombo) {
    const combo = TECH_CONFIG.branches.combos.find(function(c){return c.id === nodeId;});
    if (!combo || !canUpgradeComboNode(combo)) return false;
    const curLv = gameState.tech.combos[nodeId] || 0;
    gameState.techPoints -= TECH_CONFIG.costs[curLv];
    gameState.tech.combos[nodeId] = curLv + 1;
    invalidateTechCache();
    AudioFX.upgrade();
    return true;
  }
  if (!canUpgradeTechNode(branch, nodeId)) return false;
  const curLv = getTechLevel(branch, nodeId);
  gameState.techPoints -= TECH_CONFIG.costs[curLv];
  setTechLevel(branch, nodeId, curLv + 1);
  invalidateTechCache();
  AudioFX.upgrade();
  return true;
}
// ── 科技树节点深度计算（用于分层布局）──
function computeNodeDepths(branchId) {
  const nodes = TECH_CONFIG.branches[branchId].nodes;
  const depths = {};
  function getDepth(nid, visited) {
    if (depths[nid] !== undefined) return depths[nid];
    if (visited.has(nid)) return 0;
    visited.add(nid);
    const node = nodes[nid];
    const preKeys = Object.keys(node.pre);
    if (preKeys.length === 0) { depths[nid] = 0; return 0; }
    let maxD = 0;
    for (let i = 0; i < preKeys.length; i++) {
      const d = getDepth(preKeys[i], new Set(visited));
      if (d > maxD) maxD = d;
    }
    depths[nid] = maxD + 1;
    return depths[nid];
  }
  const nids = Object.keys(nodes);
  for (let i = 0; i < nids.length; i++) getDepth(nids[i], new Set());
  return depths;
}

function addTechPoints(amount) {
  const rateBonus = getTechBonus('techRate');
  gameState.techPoints += amount * (1 + rateBonus);
}
function applyTechToTower(tower) {
  // Apply persistent tech bonuses to a tower
  tower._baseDmg = tower.damage;
  tower._baseRange = tower.range;
  tower._baseCd = tower.attackCooldown;
}
function refreshTowerTechStats(tower) {
  // Called when tech levels change - recalculate tower stats
  const cfg = TOWER_CONFIG[tower.type];
  const lvl = getTowerLevelConfig(tower);
  const dmgMult = 1 + getTechBonus('dmg') + getTechBonus('allDmg');
  const physMult = cfg.damageType === 'physical' ? (1 + getTechBonus('physDmg')) : 1;
  const magMult = cfg.damageType === 'magic' ? (1 + getTechBonus('magDmg')) : 1;
  const spdMult = 1 + getTechBonus('spd');
  const allStatsMult = 1 + getTechBonus('allStats');

  tower.damage = Math.floor(lvl.damage * dmgMult * physMult * magMult * allStatsMult);
  tower.range = lvl.range + getTechBonus('range') + getTechBonus('ultPrec') * 1;
  tower.attackCooldown = lvl.cooldown / (spdMult * allStatsMult);
  tower.critChance = (lvl.critChance || 0) + getTechBonus('crit') + getTechBonus('ultCrit') * 0.05;
  tower.critMult = (lvl.critMult || 2.0) + getTechBonus('critDmg') + getTechBonus('ultCrit') * 0.5;
  tower.pierceCount = (lvl.pierceCount || 0) + Math.floor(getTechBonus('pierce')) + Math.floor(getTechBonus('ultPrec') * 2);
  tower.splashRadius = (lvl.splashRadius || cfg.splashRadius || 0) * (1 + getTechBonus('splash'));
  tower.chainCount = (lvl.chainCount || 0) + Math.floor(getTechBonus('chain'));
  tower.ricochet = (lvl.ricochet || 0) + Math.floor(getTechBonus('ricochet'));
  tower.executeThreshold = (lvl.executeThreshold || 0) + getTechBonus('execute');
  tower._techDmgMult = dmgMult * physMult * magMult * allStatsMult;
  // Defense bonuses
  const hpMult = 1 + getTechBonus('towerHp');
  tower.maxHp = Math.floor(cfg.cost * 2 * Math.pow(1.6, tower._lvlIdx || 0) * hpMult);
  if (tower.hp > tower.maxHp) tower.hp = tower.maxHp;
  if (getTechBonus('shield') > 0) tower._techShield = Math.floor(getTechBonus('shield'));
  if (getTechBonus('regen') > 0) tower._techRegen = getTechBonus('regen');
  if (getTechBonus('slowImm') > 0) tower._slowImmune = true;
  if (getTechBonus('curseRes') > 0) tower._curseResist = getTechBonus('curseRes');
  if (getTechBonus('reflect') > 0) tower._reflectBuff = (tower._reflectBuff || 0) + getTechBonus('reflect');
  if (getTechBonus('armor') > 0) tower._techArmor = getTechBonus('armor');
}
function refreshAllTowerTech() {
  for (const t of gameState.towers) refreshTowerTechStats(t);
}

// ═══════════ 渲染函数 ═══════════

// ── 网格渲染 ──
const GRASS_COLORS = [
  '#4a8c3f', '#4d9142', '#47873c', '#509545', '#448039',
];

function renderGrid() {
  for (let row = 0; row < GRID_ROWS; row++) {
    for (let col = 0; col < GRID_COLS; col++) {
      const x = MAP_X + col * CELL_SIZE;
      const y = MAP_Y + row * CELL_SIZE;
      const cellVal = gameState.grid[row][col];
      const isPath = cellVal >= 1 && cellVal <= 3;
      const isTower = cellVal >= 10;
      if (isTower) {
        ctx.fillStyle = '#3d6b33';
        ctx.fillRect(x + 0.5, y + 0.5, CELL_SIZE - 1, CELL_SIZE - 1);
      } else if (isPath) {
        const pathDef = PATH_DEFS[cellVal - 1];
        ctx.fillStyle = pathDef ? pathDef.color : '#d4c4a8';
        ctx.fillRect(x + 0.5, y + 0.5, CELL_SIZE - 1, CELL_SIZE - 1);
      } else {
        const terrType = (gameState._terrainTypes[row] && gameState._terrainTypes[row][col]) || 0;
        ctx.fillStyle = GRASS_COLORS[terrType % GRASS_COLORS.length];
        ctx.fillRect(x + 0.5, y + 0.5, CELL_SIZE - 1, CELL_SIZE - 1);
      }
      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x + 0.5, y + 0.5, CELL_SIZE - 1, CELL_SIZE - 1);
    }
  }
  // Path edge borders
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1.5;
  for (let row = 0; row < GRID_ROWS; row++) {
    for (let col = 0; col < GRID_COLS; col++) {
      const val = gameState.grid[row][col];
      if (val < 1 || val > 3) continue;
      const x = MAP_X + col * CELL_SIZE;
      const y = MAP_Y + row * CELL_SIZE;
      const neighbors = [
        [row-1, col, 0, 0, CELL_SIZE, 0],
        [row+1, col, 0, CELL_SIZE, CELL_SIZE, CELL_SIZE],
        [row, col-1, 0, 0, 0, CELL_SIZE],
        [row, col+1, CELL_SIZE, 0, CELL_SIZE, CELL_SIZE],
      ];
      for (const [nr, nc, x1, y1, x2, y2] of neighbors) {
        if (nr < 0 || nr >= GRID_ROWS || nc < 0 || nc >= GRID_COLS) continue;
        const nval = gameState.grid[nr][nc];
        if (nval < 1 || nval > 3) {
          ctx.beginPath();
          ctx.moveTo(x + x1, y + y1);
          ctx.lineTo(x + x2, y + y2);
          ctx.stroke();
        }
      }
    }
  }
  // Decorations
  for (const deco of (gameState._decorations || [])) {
    const cellVal = gameState.grid[deco.row][deco.col];
    if (cellVal !== 0) continue;
    const cx = MAP_X + deco.col * CELL_SIZE + CELL_SIZE / 2 + deco.offsetX;
    const cy = MAP_Y + deco.row * CELL_SIZE + CELL_SIZE / 2 + deco.offsetY;
    ctx.save();
    ctx.font = Math.round(CELL_SIZE * 0.55 * deco.scale) + 'px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(deco.emoji, cx, cy);
    ctx.restore();
  }
  // Entrance markers
  const entrances = [
    {row: PATH_DEFS[0].waypoints[0].row, label: '上', color: PATH_DEFS[0].color},
    {row: PATH_DEFS[1].waypoints[0].row, label: '中', color: PATH_DEFS[1].color},
    {row: PATH_DEFS[2].waypoints[0].row, label: '下', color: PATH_DEFS[2].color},
  ];
  for (const ent of entrances) {
    const ep = gridToPixel(0, ent.row);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(MAP_X - 1, MAP_Y + ent.row * CELL_SIZE + 2, CELL_SIZE * 0.6 + 1, CELL_SIZE - 4);
    ctx.fillStyle = ent.color;
    ctx.globalAlpha = 0.55;
    ctx.fillRect(MAP_X, MAP_Y + ent.row * CELL_SIZE + 3, CELL_SIZE * 0.5, CELL_SIZE - 6);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#f44336';
    ctx.beginPath();
    ctx.arc(ep.x, ep.y, CELL_SIZE * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('▶', ep.x + 1, ep.y);
    ctx.fillStyle = '#ef9a9a';
    ctx.font = '8px "Microsoft YaHei"';
    ctx.fillText(ent.label + '出口', ep.x, ep.y - CELL_SIZE/2 - 1);
  }
  // Base marker
  const end = gridToPixel(GRID_COLS - 1, GRID_ROWS - 1);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.arc(end.x, end.y, CELL_SIZE * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#4caf50';
  ctx.beginPath();
  ctx.arc(end.x, end.y, CELL_SIZE * 0.45, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px "Microsoft YaHei"';
  ctx.fillText('入', end.x, end.y);
  ctx.fillStyle = '#a5d6a7';
  ctx.font = '10px "Microsoft YaHei"';
  ctx.fillText('入口', end.x, end.y + CELL_SIZE/2 + 4);
  // Ghost tower preview
  if (gameState.selectedTowerType && gameState.hoveredCell) {
    const {col, row} = gameState.hoveredCell;
    const cfg = TOWER_CONFIG[gameState.selectedTowerType];
    const cellVal = gameState.grid[row][col];
    const canPlace = cellVal === 0 && gameState.gold >= cfg.cost;
    if (canPlace) {
      const pos = gridToPixel(col, row);
      const r = CELL_SIZE * 0.35;
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.translate(pos.x, pos.y);
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }
  // Spawn + base highlights
  for (const def of PATH_DEFS) {
    const sp = gridToPixel(0, def.waypoints[0].row);
    ctx.fillStyle = 'rgba(244,67,54,0.2)';
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, CELL_SIZE * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }
  const end2 = gridToPixel(GRID_COLS - 1, GRID_ROWS - 1);
  ctx.fillStyle = 'rgba(76,175,80,0.2)';
  ctx.beginPath();
  ctx.arc(end2.x, end2.y, CELL_SIZE * 0.55, 0, Math.PI * 2);
  ctx.fill();

  // Map editor preview
  if (gameState._mapEditMode && gameState._mapEditWaypoints.length > 0) {
    const wps = gameState._mapEditWaypoints;
    // Lines
    ctx.strokeStyle = '#ff0';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 3]);
    ctx.beginPath();
    const p0 = gridToPixel(wps[0].col, wps[0].row);
    ctx.moveTo(p0.x, p0.y);
    for (let i = 1; i < wps.length; i++) {
      const pi = gridToPixel(wps[i].col, wps[i].row);
      ctx.lineTo(pi.x, pi.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    // Dots with index
    for (let i = 0; i < wps.length; i++) {
      const pi = gridToPixel(wps[i].col, wps[i].row);
      ctx.fillStyle = i === 0 ? '#4caf50' : i === wps.length - 1 ? '#f44336' : '#ffd740';
      ctx.beginPath();
      ctx.arc(pi.x, pi.y, CELL_SIZE * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(i, pi.x, pi.y);
    }
  }
}

function renderRangeIndicator() {
  if (gameState.selectedTowerType && gameState.hoveredCell) {
    const {col, row} = gameState.hoveredCell;
    const cfg = TOWER_CONFIG[gameState.selectedTowerType];
    const canPlace = gameState.grid[row][col] === 0 &&
                     gameState.gold >= cfg.cost;
    const pos = gridToPixel(col, row);
    const rangePx = (cfg.levels[0].range + getTechBonus('range')) * CELL_SIZE;

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, rangePx, 0, Math.PI * 2);
    ctx.fillStyle = canPlace ? 'rgba(76,175,80,0.15)' : 'rgba(244,67,54,0.15)';
    ctx.fill();
    ctx.strokeStyle = canPlace ? 'rgba(76,175,80,0.5)' : 'rgba(244,67,54,0.5)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (gameState.selectedPlacedTower) {
    const t = gameState.selectedPlacedTower;
    const pos = gridToPixel(t.col, t.row);
    const lvl = getTowerLevelConfig(t);
    const rangePx = lvl.range * CELL_SIZE;

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, rangePx, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ── 陷阱渲染 ──
function renderTraps() {
  if (!gameState._traps) return;
  for (const trap of gameState._traps) {
    const alpha = Math.min(1, trap.timer / 3);
    ctx.fillStyle = 'rgba(121,85,72,0.4)';
    ctx.beginPath();
    ctx.arc(trap.x, trap.y, CELL_SIZE * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(244,67,54,${alpha})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = `rgba(244,67,54,${alpha})`;
    ctx.font = '10px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('⚠', trap.x, trap.y + 3);
  }
}

// ── 塔渲染 ──
function renderTower(tower) {
  const pos = gridToPixel(tower.col, tower.row);
  const cfg = TOWER_CONFIG[tower.type];
  const cx = pos.x;
  const cy = pos.y;
  const r = CELL_SIZE * 0.38;

  ctx.save();
  ctx.translate(cx, cy);

  // base plate
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.arc(0, 1, r + 2, 0, Math.PI * 2);
  ctx.fill();

  // Rotate toward target (offset -PI/2 since sprites point UP)
  ctx.save();
  ctx.rotate((tower.angle || 0) + Math.PI / 2);

  if (tower.type === 'arrow') {
    drawArrowTower(tower, cfg, r);
  } else if (tower.type === 'cannon') {
    drawCannonTower(tower, cfg, r);
  } else if (tower.type === 'ice') {
    drawIceTower(tower, cfg, r);
  } else if (tower.type === 'lightning') {
    drawLightningTower(tower, cfg, r);
  } else if (tower.type === 'poison') {
    drawPoisonTower(tower, cfg, r);
  } else if (tower.type === 'barracks') {
    drawBarracksTower(tower, cfg, r);
  } else if (tower.type === 'sniper') {
    drawSniperTower(tower, cfg, r);
  } else if (tower.type === 'flame') {
    drawFlameTower(tower, cfg, r);
  } else if (tower.type === 'aura') {
    drawAuraTower(tower, cfg, r);
  } else if (tower.type === 'laser') {
    drawLaserTower(tower, cfg, r);
  }

  ctx.restore();

  ctx.restore();

  // Branch indicator ring
  const branch = getTowerBranch(tower);
  if (branch > 0) {
    ctx.strokeStyle = branch === 1 ? 'rgba(100,180,255,0.65)' : 'rgba(255,140,40,0.65)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
    ctx.stroke();
  }

  // disabled indicator
  if (tower.disabled) {
    const dx = r * 0.65;
    ctx.strokeStyle = '#f44336';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - dx, cy - dx);
    ctx.lineTo(cx + dx, cy + dx);
    ctx.moveTo(cx + dx, cy - dx);
    ctx.lineTo(cx - dx, cy + dx);
    ctx.stroke();
    // red glow
    ctx.strokeStyle = 'rgba(244,67,54,0.35)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 6, 0, Math.PI * 2);
    ctx.setLineDash([4, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Tower HP bar (show when damaged)
  if (tower.hp < tower.maxHp) {
    const hpR = tower.hp / tower.maxHp;
    const bw = r * 2;
    const bh = 3;
    const bY = cy + r + 8;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(cx - bw/2 - 1, bY - 1, bw + 2, bh + 2);
    ctx.fillStyle = hpR > 0.5 ? '#4caf50' : hpR > 0.25 ? '#ff9800' : '#f44336';
    ctx.fillRect(cx - bw/2, bY, bw * hpR, bh);
  }

  // selection highlight (in world space)
  if (gameState.selectedPlacedTower === tower) {
    ctx.beginPath();
    ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawArrowTower(tower, cfg, r) {
  const lvl = getTowerVisualLevel(tower);
  ctx.fillStyle = cfg.colorDark;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // arrowhead
  ctx.fillStyle = cfg.color;
  const s = r * (0.6 + lvl * 0.15);
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(-s * 0.6, s * 0.5);
  ctx.lineTo(s * 0.6, s * 0.5);
  ctx.closePath();
  ctx.fill();

  // level indicators
  if (lvl >= 2) {
    ctx.strokeStyle = cfg.colorLight;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (lvl >= 3) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.1, 0, Math.PI * 2);
    ctx.setLineDash([3, 2]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if (lvl >= 4) {
    ctx.strokeStyle = 'rgba(255,215,0,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.25, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,215,0,0.3)';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.15, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCannonTower(tower, cfg, r) {
  const lvl = getTowerVisualLevel(tower);
  ctx.fillStyle = cfg.colorDark;
  ctx.fillRect(-r * 0.8, -r * 0.8, r * 1.6, r * 1.6);

  ctx.fillStyle = cfg.color;
  const inner = r * (0.5 + lvl * 0.1);
  ctx.fillRect(-inner, -inner, inner * 2, inner * 2);

  // barrel
  ctx.fillStyle = cfg.colorDark;
  const bw = r * 0.35;
  const bh = r * (0.7 + lvl * 0.2);
  ctx.fillRect(-bw, -bh - inner, bw * 2, bh);

  if (lvl >= 2) {
    ctx.strokeStyle = cfg.colorLight;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-r * 0.8, -r * 0.8, r * 1.6, r * 1.6);
  }
  if (lvl >= 3) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -inner - bh + 2, bw * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }
  if (lvl >= 4) {
    ctx.strokeStyle = 'rgba(255,215,0,0.8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(-r * 0.95, -r * 0.95, r * 1.9, r * 1.9);
    ctx.fillStyle = 'rgba(255,215,0,0.4)';
    ctx.beginPath();
    ctx.arc(0, -inner - bh + 2, bw * 0.9, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawIceTower(tower, cfg, r) {
  const lvl = getTowerVisualLevel(tower);
  // diamond shape
  ctx.fillStyle = cfg.colorDark;
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(r, 0);
  ctx.lineTo(0, r);
  ctx.lineTo(-r, 0);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = cfg.color;
  const s = r * (0.5 + lvl * 0.12);
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(s, 0);
  ctx.lineTo(0, s);
  ctx.lineTo(-s, 0);
  ctx.closePath();
  ctx.fill();

  // frost crystals (small diamonds around)
  if (lvl >= 2) {
    ctx.fillStyle = cfg.colorLight;
    for (let i = 0; i < 4; i++) {
      const angle = i * Math.PI / 2 + Math.PI / 4;
      const dx = Math.cos(angle) * r * 0.85;
      const dy = Math.sin(angle) * r * 0.85;
      ctx.beginPath();
      ctx.arc(dx, dy, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (lvl >= 3) {
    ctx.strokeStyle = '#e3f2fd';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.15);
    ctx.lineTo(r * 1.15, 0);
    ctx.lineTo(0, r * 1.15);
    ctx.lineTo(-r * 1.15, 0);
    ctx.closePath();
    ctx.setLineDash([3, 2]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if (lvl >= 4) {
    ctx.strokeStyle = 'rgba(255,215,0,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.35);
    ctx.lineTo(r * 1.35, 0);
    ctx.lineTo(0, r * 1.35);
    ctx.lineTo(-r * 1.35, 0);
    ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#ffd740';
    for (let i = 0; i < 4; i++) {
      const angle = i * Math.PI / 2 + Math.PI / 4;
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * r * 1.2, Math.sin(angle) * r * 1.2, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawLightningTower(tower, cfg, r) {
  const lvl = getTowerVisualLevel(tower);
  // hexagonal base
  ctx.fillStyle = cfg.colorDark;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3 - Math.PI / 6;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();

  // inner crystal
  ctx.fillStyle = cfg.color;
  const s = r * (0.45 + lvl * 0.12);
  ctx.beginPath();
  ctx.moveTo(0, -s * 1.3);
  ctx.lineTo(s * 0.7, -s * 0.3);
  ctx.lineTo(s * 0.7, s * 0.7);
  ctx.lineTo(-s * 0.7, s * 0.7);
  ctx.lineTo(-s * 0.7, -s * 0.3);
  ctx.closePath();
  ctx.fill();

  // lightning bolt
  ctx.fillStyle = '#ffeb3b';
  ctx.beginPath();
  const bs = r * 0.4;
  ctx.moveTo(bs * 0.2, -bs);
  ctx.lineTo(-bs * 0.4, -bs * 0.15);
  ctx.lineTo(-bs * 0.1, -bs * 0.1);
  ctx.lineTo(-bs * 0.5, bs * 0.5);
  ctx.lineTo(bs * 0.15, -bs * 0.1);
  ctx.lineTo(-bs * 0.1, -bs * 0.05);
  ctx.lineTo(bs * 0.5, bs * 0.7);
  ctx.closePath();
  ctx.fill();

  if (lvl >= 2) {
    ctx.strokeStyle = cfg.colorLight;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 - Math.PI / 6;
      const px = Math.cos(a) * r * 0.9;
      const py = Math.sin(a) * r * 0.9;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  }
  if (lvl >= 3) {
    ctx.strokeStyle = '#ffeb3b';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.1, 0, Math.PI * 2);
    ctx.setLineDash([3, 2]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if (lvl >= 4) {
    ctx.strokeStyle = 'rgba(255,215,0,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 - Math.PI / 6;
      const px = Math.cos(a) * r * 1.2;
      const py = Math.sin(a) * r * 1.2;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,215,0,0.25)';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPoisonTower(tower, cfg, r) {
  const lvl = getTowerVisualLevel(tower);
  // base
  ctx.fillStyle = cfg.colorDark;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  // inner
  ctx.fillStyle = cfg.color;
  ctx.beginPath();
  ctx.arc(0, 0, r*0.65, 0, Math.PI*2); ctx.fill();
  // poison drip
  ctx.fillStyle = '#a5d6a7';
  const dr = r*0.5;
  ctx.beginPath();
  ctx.moveTo(-dr*0.6, -dr*0.8);
  ctx.lineTo(dr*0.6, -dr*0.8);
  ctx.lineTo(0, dr*0.7);
  ctx.closePath(); ctx.fill();
  // bubbles
  ctx.fillStyle = 'rgba(165,214,167,0.6)';
  ctx.beginPath();
  ctx.arc(-dr*0.3, -dr*0.2, dr*0.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.arc(dr*0.35, dr*0.1, dr*0.15, 0, Math.PI*2); ctx.fill();
  if (lvl >= 2) {
    ctx.strokeStyle = cfg.colorLight;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r*0.88, 0, Math.PI*2); ctx.stroke();
  }
  if (lvl >= 3) {
    ctx.fillStyle = 'rgba(165,214,167,0.4)';
    ctx.beginPath();
    ctx.arc(0, 0, r*1.15, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.setLineDash([3,2]); ctx.stroke(); ctx.setLineDash([]);
  }
  if (lvl >= 4) {
    ctx.strokeStyle = 'rgba(255,215,0,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r*1.35, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,215,0,0.2)';
    ctx.beginPath();
    ctx.arc(0, 0, r*1.35, 0, Math.PI*2); ctx.fill();
  }
}

function drawBarracksTower(tower, cfg, r) {
  const lvl = getTowerVisualLevel(tower);
  // square fortress base
  ctx.fillStyle = cfg.colorDark;
  ctx.fillRect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7);
  ctx.fillStyle = cfg.color;
  ctx.fillRect(-r * 0.6, -r * 0.6, r * 1.2, r * 1.2);
  // door
  ctx.fillStyle = cfg.colorDark;
  ctx.fillRect(-r * 0.2, r * 0.1, r * 0.4, r * 0.5);
  // flag on top
  ctx.fillStyle = '#fff';
  ctx.fillRect(-r * 0.05, -r * 0.85, r * 0.08, r * 0.35);
  ctx.fillStyle = '#f44336';
  ctx.beginPath();
  ctx.moveTo(r * 0.03, -r * 0.85);
  ctx.lineTo(r * 0.4, -r * 0.7);
  ctx.lineTo(r * 0.03, -r * 0.55);
  ctx.closePath();
  ctx.fill();
  // crenellations
  ctx.fillStyle = cfg.colorDark;
  const cw = r * 0.22;
  const ch = r * 0.15;
  for (let ci = -2; ci <= 2; ci++) {
    ctx.fillRect(ci * cw * 2 - cw/2, -r * 0.85, cw, ch);
  }
  if (lvl >= 2) {
    ctx.strokeStyle = cfg.colorLight;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7);
  }
  if (lvl >= 3) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.1, 0, Math.PI * 2);
    ctx.setLineDash([3, 2]); ctx.stroke(); ctx.setLineDash([]);
    // second flag
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.moveTo(r * 0.03, -r * 0.85);
    ctx.lineTo(-r * 0.35, -r * 0.7);
    ctx.lineTo(r * 0.03, -r * 0.55);
    ctx.closePath();
    ctx.fill();
  }
  if (lvl >= 4) {
    ctx.strokeStyle = 'rgba(255,215,0,0.8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(-r * 1.0, -r * 1.0, r * 2.0, r * 2.0);
    ctx.fillStyle = 'rgba(255,215,0,0.3)';
    ctx.fillRect(-r * 0.3, -r * 1.05, r * 0.6, r * 0.2);
  }
  // disabled indicator
  if (tower.disabled) {
    ctx.strokeStyle = '#f44336';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-r * 0.7, -r * 0.7);
    ctx.lineTo(r * 0.7, r * 0.7);
    ctx.moveTo(r * 0.7, -r * 0.7);
    ctx.lineTo(-r * 0.7, r * 0.7);
    ctx.stroke();
  }
}

function drawSniperTower(tower, cfg, r) {
  const lvl = getTowerVisualLevel(tower);
  // tall hexagonal base
  ctx.fillStyle = cfg.colorDark;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3 - Math.PI / 6;
    const px = Math.cos(a) * r * 0.8;
    const py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  // inner platform
  ctx.fillStyle = cfg.color;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2); ctx.fill();
  // long barrel pointing forward (UP direction before rotation)
  ctx.fillStyle = cfg.colorLight;
  const bw = r * 0.15;
  const bh = r * (0.9 + lvl * 0.2);
  ctx.fillRect(-bw, -bh, bw * 2, bh);
  // scope
  ctx.fillStyle = '#fff';

  if (lvl >= 2) {
    ctx.strokeStyle = cfg.colorLight;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2); ctx.stroke();
  }
  if (lvl >= 3) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.1, 0, Math.PI * 2);
    ctx.setLineDash([3, 2]); ctx.stroke(); ctx.setLineDash([]);
    // crosshair marker
    ctx.strokeStyle = '#ffc107';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(-r * 0.3, 0); ctx.lineTo(r * 0.3, 0);
    ctx.moveTo(0, -r * 0.3); ctx.lineTo(0, r * 0.3);
    ctx.stroke();
  }
  if (lvl >= 4) {
    ctx.strokeStyle = 'rgba(255,215,0,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.3, 0, Math.PI * 2);
    ctx.stroke();
    // golden crosshair
    ctx.strokeStyle = 'rgba(255,215,0,0.6)';
    ctx.lineWidth = 1.5;
    const cl = r * 0.45;
    ctx.beginPath();
    ctx.moveTo(-cl, 0); ctx.lineTo(r * 0.15, 0);
    ctx.moveTo(r * 0.25, 0); ctx.lineTo(cl, 0);
    ctx.moveTo(0, -cl); ctx.lineTo(0, r * 0.15);
    ctx.moveTo(0, r * 0.25); ctx.lineTo(0, cl);
    ctx.stroke();
  }
}

function drawFlameTower(tower, cfg, r) {

  ctx.quadraticCurveTo(fw, -fh * 0.3, fw * 0.6, r * 0.1);
  ctx.quadraticCurveTo(fw * 0.1, r * 0.2, 0, -r * 0.15);
  ctx.quadraticCurveTo(-fw * 0.1, r * 0.2, -fw * 0.6, r * 0.1);
  ctx.quadraticCurveTo(-fw, -fh * 0.3, 0, -fh);
  ctx.fill();
  // inner flame (lighter)
  ctx.fillStyle = '#ffcc80';
  ctx.beginPath();
  const ifh = fh * 0.6;
  const ifw = fw * 0.5;
  ctx.moveTo(0, -ifh);
  ctx.quadraticCurveTo(ifw, -ifh * 0.2, ifw * 0.5, r * 0.05);
  ctx.quadraticCurveTo(0, r * 0.15, -ifw * 0.5, r * 0.05);
  ctx.quadraticCurveTo(-ifw, -ifh * 0.2, 0, -ifh);
  ctx.fill();
  if (lvl >= 2) {
    ctx.strokeStyle = cfg.colorLight;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2); ctx.stroke();
  }
  if (lvl >= 3) {
    ctx.strokeStyle = '#ffeb3b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.12, 0, Math.PI * 2);
    ctx.setLineDash([3, 2]); ctx.stroke(); ctx.setLineDash([]);
  }
  if (lvl >= 4) {
    ctx.strokeStyle = 'rgba(255,215,0,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.3, 0, Math.PI * 2);
    ctx.stroke();
    // white-blue inner core
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.35);
    ctx.quadraticCurveTo(r * 0.2, -r * 0.05, r * 0.15, r * 0.15);
    ctx.quadraticCurveTo(0, r * 0.1, -r * 0.15, r * 0.15);
    ctx.quadraticCurveTo(-r * 0.2, -r * 0.05, 0, -r * 0.35);
    ctx.fill();
  }
}

function drawLaserTower(tower,cfg,r){const lvl=getTowerVisualLevel(tower);ctx.fillStyle=cfg.colorDark;ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6,px=Math.cos(a)*r,py=Math.sin(a)*r;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();ctx.fill();ctx.fillStyle=cfg.color;ctx.beginPath();ctx.arc(0,0,r*0.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r*0.22,0,Math.PI*2);ctx.fill();if(tower._heatStacks>0){const hr=tower._heatStacks/(getTowerLevelConfig(tower).maxHeatStacks||getTowerLevelConfig(tower)._baseMaxHeat||20);ctx.strokeStyle=`rgba(255,${Math.round(100-hr*100)},${Math.round(40-hr*40)},${0.3+hr*0.7})`;ctx.lineWidth=1.5+hr*3;ctx.beginPath();ctx.arc(0,0,r*0.82,0,Math.PI*2);ctx.stroke();}if(lvl>=2){ctx.strokeStyle=cfg.colorLight;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,r*0.82,0,Math.PI*2);ctx.stroke();}if(lvl>=3){ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,r*1.05,0,Math.PI*2);ctx.setLineDash([3,2]);ctx.stroke();ctx.setLineDash([]);}if(lvl>=4){ctx.strokeStyle='rgba(255,215,0,0.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r*1.25,0,Math.PI*2);ctx.stroke();}}
function drawAuraTower(tower, cfg, r) {
  const lvl = getTowerVisualLevel(tower);
  // outer glow ring
  ctx.fillStyle = 'rgba(255,215,64,0.12)';
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.3, 0, Math.PI * 2); ctx.fill();
  // base
  ctx.fillStyle = cfg.colorDark;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  // inner pulsing star
  ctx.fillStyle = cfg.color;
  const spikes = 6;
  const outerR = r * (0.55 + lvl * 0.1);
  const innerR = r * 0.25;
  ctx.beginPath();
  for (let i = 0; i < spikes * 2; i++) {
    const a = i * Math.PI / spikes - Math.PI / 2;
    const rad = i % 2 === 0 ? outerR : innerR;
    if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
    else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fill();
  // center gem
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
  // upward rays
  ctx.strokeStyle = cfg.colorLight;
  ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    const len = r * (0.9 + lvl * 0.15);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.4, Math.sin(a) * r * 0.4);
    ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
    ctx.stroke();
  }
  if (lvl >= 2) {
    ctx.strokeStyle = cfg.colorLight;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2); ctx.stroke();
  }
  if (lvl >= 3) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.2, 0, Math.PI * 2);
    ctx.setLineDash([3, 2]); ctx.stroke(); ctx.setLineDash([]);
  }
  if (lvl >= 4) {
    ctx.strokeStyle = 'rgba(255,215,0,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.5, 0, Math.PI * 2);
    ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,215,0,0.15)';
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.5, 0, Math.PI * 2); ctx.fill();
    // inner gem glow
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2); ctx.fill();
  }
}

function renderTowers() {
  // Draw sniper targeting lasers first (below towers)
  for (const tower of gameState.towers) {
    if ((tower.type === 'sniper' || tower.type === 'arrow') && tower.target && tower.target.alive && !tower.disabled) {
      const tpos = gridToPixel(tower.col, tower.row);
      const alpha = Math.min(0.45, tower.cooldownRemaining <= 0.1 ? 0.5 : 0.12);
      ctx.strokeStyle = tower.type === 'sniper'
        ? `rgba(255,23,68,${alpha})`
        : `rgba(76,175,80,${alpha})`;
      ctx.lineWidth = tower.type === 'sniper' ? 1.0 : 0.6;
      ctx.setLineDash([6, 8]);
      ctx.beginPath();
      ctx.moveTo(tpos.x, tpos.y);
      ctx.lineTo(tower.target.x, tower.target.y);
      ctx.stroke();
      ctx.setLineDash([]);
      // Aim dot on target
      if (tower.cooldownRemaining <= 0.1) {
        ctx.fillStyle = `rgba(255,23,68,${0.7 - tower.cooldownRemaining * 5})`;
        ctx.beginPath();
        ctx.arc(tower.target.x, tower.target.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  for (const tower of gameState.towers) {
    renderTower(tower);
  }
}

// ── 敌人渲染 ──
function renderEnemies() {
  const total = gameState.enemies.length;
  const showDetails = total < 80;
  const showSimple = total >= 150;
  for (const enemy of gameState.enemies) {
    if (!enemy.alive) continue;
    const cfg = ENEMY_CONFIG[enemy.type];
    const s = enemy.size;
    const x = enemy.x;
    const y = enemy.y;

    // direction angle
    const path = gameState.paths[enemy.pathIndex || 0];
    const idx = Math.floor(enemy.pathProgress);
    const nextIdx = Math.min(idx + 1, path.pixels.length - 1);
    const currPx = path.pixels[idx];
    const nextPx = path.pixels[nextIdx];
    const angle = Math.atan2(nextPx.y - currPx.y, nextPx.x - currPx.x);

    ctx.save();
    ctx.translate(x, y);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(1, 2, s, s * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    // body — fast path when many enemies: simple circle
    if (!showDetails) {
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = cfg.colorDark;
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (enemy.type === 'fast') {
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * s, Math.sin(angle) * s);
      ctx.lineTo(Math.cos(angle + 2.3) * s * 0.7, Math.sin(angle + 2.3) * s * 0.7);
      ctx.lineTo(Math.cos(angle - 2.3) * s * 0.7, Math.sin(angle - 2.3) * s * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = cfg.colorDark;
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (enemy.type === 'tank') {
      ctx.fillStyle = cfg.color;
      ctx.fillRect(-s * 0.7, -s * 0.7, s * 1.4, s * 1.4);
      ctx.strokeStyle = cfg.colorDark;
      ctx.lineWidth = 2;
      ctx.strokeRect(-s * 0.7, -s * 0.7, s * 1.4, s * 1.4);
    } else if (enemy.type === 'elite') {
      // diamond shape with glow
      ctx.fillStyle = cfg.colorDark;
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      ctx.moveTo(0, -s*0.7); ctx.lineTo(s*0.7, 0); ctx.lineTo(0, s*0.7); ctx.lineTo(-s*0.7, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffd740';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
      ctx.closePath(); ctx.stroke();
    } else if (enemy.type === 'shielded') {
      ctx.fillStyle = cfg.colorDark;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      ctx.arc(0, 0, s*0.7, 0, Math.PI*2); ctx.fill();
      if (enemy.shield > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, s + 3, 0, Math.PI*2);
        ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
      }
    } else if (enemy.type === 'healer') {
      ctx.fillStyle = cfg.colorDark;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      // cross shape
      const cw = s*0.3, ch = s*0.8;
      ctx.fillRect(-cw, -ch, cw*2, ch*2);
      ctx.fillRect(-ch, -cw, ch*2, cw*2);
      ctx.fill();
      if (enemy._healTimer > 0 && enemy._healTimer < enemy._healInterval - 0.3) {
        ctx.strokeStyle = 'rgba(129,199,132,0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 0, s + 6, 0, Math.PI*2);
        ctx.setLineDash([2, 3]); ctx.stroke(); ctx.setLineDash([]);
      }
    } else if (enemy.type === 'swarm') {
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cfg.colorDark;
      ctx.beginPath();
      ctx.arc(s*0.3, -s*0.2, s*0.35, 0, Math.PI*2); ctx.fill();
    } else if (enemy.type === 'splitter') {
      ctx.fillStyle = cfg.colorDark;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cfg.color;
      // two overlapping circles
      ctx.beginPath();
      ctx.arc(-s*0.3, 0, s*0.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.arc(s*0.3, 0, s*0.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, -s*0.2, s*0.2, 0, Math.PI*2); ctx.fill();
    } else if (enemy.type === 'phantom') {
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = cfg.colorDark;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      // wavy ghost shape
      ctx.arc(0, -s*0.2, s*0.8, Math.PI, 0); ctx.fill();
      ctx.fillRect(-s*0.7, -s*0.2, s*1.4, s*0.7);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.arc(-s*0.25, -s*0.1, s*0.18, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.arc(s*0.25, -s*0.1, s*0.18, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (enemy.type === 'berserker') {
      ctx.fillStyle = cfg.colorDark;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      // spiky shape
      const spikes = 8;
      for (let sp = 0; sp < spikes; sp++) {
        const a1 = sp * Math.PI*2/spikes;
        const a2 = (sp+0.5) * Math.PI*2/spikes;
        if (sp===0) ctx.moveTo(Math.cos(a2)*s*0.5, Math.sin(a2)*s*0.5);
        ctx.lineTo(Math.cos(a1)*s, Math.sin(a1)*s);
        ctx.lineTo(Math.cos(a2)*s*0.5, Math.sin(a2)*s*0.5);
      }
      ctx.closePath(); ctx.fill();
      if (enemy._berserked) {
        ctx.strokeStyle = '#ff1744';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, s+3, 0, Math.PI*2);
        ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);
      }
    } else if (enemy.type === 'armored') {
      ctx.fillStyle = cfg.colorDark;
      ctx.fillRect(-s*0.75, -s*0.75, s*1.5, s*1.5);
      ctx.fillStyle = cfg.color;
      ctx.fillRect(-s*0.55, -s*0.55, s*1.1, s*1.1);
      ctx.strokeStyle = '#cfd8dc';
      ctx.lineWidth = 2;
      ctx.strokeRect(-s*0.75, -s*0.75, s*1.5, s*1.5);
      // shield icon
      ctx.fillStyle = '#cfd8dc';
      ctx.font = (s*0.8) + 'px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🛡', 0, 0);
    } else if (enemy.type === 'regen') {
      ctx.fillStyle = cfg.colorDark;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      ctx.arc(0, 0, s*0.7, 0, Math.PI*2); ctx.fill();
      // + cross
      ctx.fillStyle = '#fff';
      ctx.fillRect(-s*0.5, -s*0.1, s*1, s*0.2);
      ctx.fillRect(-s*0.1, -s*0.5, s*0.2, s*1);
      if (enemy._regenTimer < enemy.regenInterval * 0.3) {
        ctx.strokeStyle = 'rgba(102,187,106,0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, s+4, 0, Math.PI*2);
        ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
      }
    } else if (enemy.type === 'summoner') {
      ctx.fillStyle = cfg.colorDark;
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s*0.7, s*0.4); ctx.lineTo(-s*0.7, s*0.4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = cfg.color;
      const ss = s*0.55;
      ctx.beginPath();
      ctx.moveTo(0, -ss); ctx.lineTo(ss*0.7, ss*0.4); ctx.lineTo(-ss*0.7, ss*0.4);
      ctx.closePath(); ctx.fill();
      // eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, -s*0.1, s*0.22, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(0, -s*0.1, s*0.1, 0, Math.PI*2); ctx.fill();
    } else if (enemy.type === 'saboteur') {
      // gear/cog shape
      ctx.fillStyle = cfg.colorDark;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cfg.color;
      const teeth = 6;
      for (let t = 0; t < teeth; t++) {
        const a1 = t * Math.PI*2/teeth;
        const a2 = (t+0.5) * Math.PI*2/teeth;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a1)*s*0.55, Math.sin(a1)*s*0.55);
        ctx.lineTo(Math.cos(a1)*s, Math.sin(a1)*s);
        ctx.lineTo(Math.cos(a2)*s*0.7, Math.sin(a2)*s*0.7);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath();
      ctx.arc(0, 0, s*0.3, 0, Math.PI*2); ctx.fill();
      // wrench icon (simplified as lines)
      ctx.fillStyle = '#212121';
      ctx.fillRect(-s*0.2, -s*0.08, s*0.4, s*0.16);
      if (enemy._sabotageReady !== false) {
        ctx.strokeStyle = 'rgba(255,87,34,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, s+4, 0, Math.PI*2);
        ctx.setLineDash([2, 3]); ctx.stroke(); ctx.setLineDash([]);
      }
    } else if (enemy.type === 'boss') {
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#f44336';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = '#f44336';
      for (let i = -2; i <= 2; i++) {
        const sx = i * s * 0.35;
        ctx.beginPath();
        ctx.moveTo(sx - 3, -s - 1);
        ctx.lineTo(sx, -s - 5 - Math.abs(i) * 2);
        ctx.lineTo(sx + 3, -s - 1);
        ctx.closePath();
        ctx.fill();
      }
    } else {
      // normal - circle
      ctx.fillStyle = cfg.color;
      ctx.beginPath();
      ctx.arc(0, 0, s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = cfg.colorDark;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // eyes
    const eyeOffset = s * 0.3;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(Math.cos(angle) * eyeOffset + Math.cos(angle + Math.PI/2) * s * 0.35,
            Math.sin(angle) * eyeOffset + Math.sin(angle + Math.PI/2) * s * 0.35,
            s * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(Math.cos(angle) * eyeOffset + Math.cos(angle - Math.PI/2) * s * 0.35,
            Math.sin(angle) * eyeOffset + Math.sin(angle - Math.PI/2) * s * 0.35,
            s * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(Math.cos(angle) * (eyeOffset + 1) + Math.cos(angle + Math.PI/2) * s * 0.35,
            Math.sin(angle) * (eyeOffset + 1) + Math.sin(angle + Math.PI/2) * s * 0.35,
            s * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(Math.cos(angle) * (eyeOffset + 1) + Math.cos(angle - Math.PI/2) * s * 0.35,

function renderProjectiles() {
  for (const proj of gameState.projectiles) {
    if (!proj.alive) continue;
    // Arc trail
    if (proj.arcPath && proj.arcPath.length > 0) {
      ctx.strokeStyle = proj.color;
      ctx.globalAlpha = 0.2;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      const startIdx = Math.max(0, Math.floor(proj.arcProgress * (proj.arcPath.length - 1)) - 4);
      ctx.moveTo(proj.arcPath[startIdx].x, proj.arcPath[startIdx].y);
      for (let pi = startIdx + 1; pi < proj.arcPath.length; pi++) {
        ctx.lineTo(proj.arcPath[pi].x, proj.arcPath[pi].y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = proj.color;
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, proj.type === 'cannon' ? 4 : proj.type === 'lightning' ? 3 : 2.5, 0, Math.PI * 2);
    ctx.fill();
    // trail
    if (proj.type !== 'lightning' && !proj.arcPath) {
      const angle = Math.atan2(proj.target.y - proj.y, proj.target.x - proj.x);
      ctx.strokeStyle = proj.color;
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(proj.x, proj.y);
      ctx.lineTo(proj.x - Math.cos(angle) * 8, proj.y - Math.sin(angle) * 8);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // chain lightning arcs
    if (proj.chainTargets) {
      for (const chain of proj.chainTargets) {
        ctx.strokeStyle = '#ce93d8';
        ctx.globalAlpha = 0.8;
        ctx.lineWidth = 2;
        ctx.beginPath();
        const dx = chain.to.x - chain.from.x;
        const dy = chain.to.y - chain.from.y;
        const segs = 4;
        for (let s = 0; s <= segs; s++) {
          const t = s / segs;
          const x = chain.from.x + dx * t;
          const y = chain.from.y + dy * t;
          const offset = (s > 0 && s < segs) ? (Math.random() - 0.5) * 12 : 0;
          if (s === 0) ctx.moveTo(x, y + offset);
          else ctx.lineTo(x, y + offset);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }
}

function renderSplashFX() {
  if (!gameState._splashFX) return;
  for (const fx of gameState._splashFX) {
    if (fx.life <= 0) continue;
    const alpha = fx.life / fx.maxLife;
    const r = fx.radius * (0.6 + alpha * 0.4);
    const isCannon = fx.type === 'cannon';
    const ringExpand = isCannon ? 2.0 : 1.5;
    const ringR = fx.radius * (ringExpand - alpha * 0.8);
    // Color scheme by tower type
    const isPoison = fx.type === 'poison';
    const isIce = fx.type === 'ice';
    const ringColor = isPoison ? `rgba(100,220,80,${alpha * 0.7})`
      : isIce ? `rgba(100,180,255,${alpha * 0.7})`
      : `rgba(255,200,60,${alpha * 0.7})`;
    ctx.strokeStyle = ringColor;
    ctx.lineWidth = 3 * alpha;
    ctx.beginPath();
    ctx.arc(fx.x, fx.y, ringR, 0, Math.PI * 2);
    ctx.stroke();
    // Inner flash gradient
    const grad = ctx.createRadialGradient(fx.x, fx.y, 0, fx.x, fx.y, r);
    if (isPoison) {
      grad.addColorStop(0, `rgba(220,255,200,${alpha * 0.9})`);
      grad.addColorStop(0.2, `rgba(100,220,60,${alpha * 0.7})`);
      grad.addColorStop(0.5, `rgba(30,160,20,${alpha * 0.4})`);
      grad.addColorStop(1, `rgba(10,80,0,0)`);
    } else if (isIce) {
      grad.addColorStop(0, `rgba(220,240,255,${alpha * 0.9})`);
      grad.addColorStop(0.2, `rgba(100,180,255,${alpha * 0.7})`);
      grad.addColorStop(0.5, `rgba(30,100,220,${alpha * 0.4})`);
      grad.addColorStop(1, `rgba(0,40,120,0)`);
    } else {
      grad.addColorStop(0, `rgba(255,255,220,${alpha * 0.9})`);
      grad.addColorStop(0.15, `rgba(255,220,80,${alpha * 0.7})`);
      grad.addColorStop(0.4, `rgba(255,140,20,${alpha * 0.45})`);
      grad.addColorStop(0.7, `rgba(255,60,10,${alpha * 0.15})`);
      grad.addColorStop(1, `rgba(255,20,0,0)`);
    }
    ctx.beginPath();
    ctx.arc(fx.x, fx.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

let _particleCanvas = null, _particleCtx = null;
function renderParticles() {
  const particles = gameState.particles;
  if (particles.length === 0) return;
  // Lazy init offscreen canvas
  if (!_particleCanvas) {
    _particleCanvas = document.createElement('canvas');
    _particleCanvas.width = CANVAS_W;
    _particleCanvas.height = CANVAS_H;
    _particleCtx = _particleCanvas.getContext('2d');
  }
  const pctx = _particleCtx;
  pctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  // Batch: use fillRect for tiny particles (no beginPath/arc overhead)
  for (const p of particles) {
    if (!p.alive) continue;
    const alpha = p.life / p.maxLife;
    const size = Math.max(1, p.size * alpha);
    pctx.globalAlpha = alpha;
    pctx.fillStyle = p.color;
    pctx.fillRect(p.x - size/2, p.y - size/2, size, size);
  }
  pctx.globalAlpha = 1;
  ctx.drawImage(_particleCanvas, 0, 0);
}

    const aa2 = cfg.damageType==='magic'||gameState.selectedTowerType==='arrow'||gameState.selectedTowerType==='ice'||gameState.selectedTowerType==='lightning'||gameState.selectedTowerType==='sniper';
    let ex=[]; if(lvl.splashRadius)ex.push('溅射'+lvl.splashRadius+'格'); if(lvl.slowAmount)ex.push('减速'+Math.round(lvl.slowAmount*100)+'%'); if(lvl.chainCount)ex.push('连锁'+lvl.chainCount); if(lvl.dotDamage)ex.push('毒'+lvl.dotDamage+'/s'); if(lvl.guardCount)ex.push('守卫'+lvl.guardCount); if(lvl.buffDmg)ex.push('光环+'+Math.round(lvl.buffDmg*100)+'%'); ex.push(aa2?'✅对空':'❌对空');
    ctx.fillStyle = '#999'; ctx.fillText(ex.join(' · '), px+16, prevY+34);
    const dps=Math.round(lvl.damage/lvl.cooldown); ctx.fillStyle = '#ff9800'; ctx.fillText('DPS:'+dps+'  '+cfg.cost+'金', px+16, prevY+48);
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.textAlign = 'right';
    const hk = types.indexOf(gameState.selectedTowerType)+1; ctx.fillText('按键 '+hk, px+PANEL_W-16, prevY+48);
  }

  // Wave preview (during build phase)
  if (gameState.phase === 'build' && gameState.wavePreview) {
    const wpY = py + 228;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.roundRect(px + 8, wpY, PANEL_W - 16, 72, 6);
    ctx.fill();
    ctx.fillStyle = '#e0e0e0';
    ctx.font = 'bold 12px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('下一波预览 (共' + gameState.wavePreview.total + '个)', px + PANEL_W/2, wpY + 5);
    const preview = gameState.wavePreview.counts;
    const previewTypes = [
      {key:'normal', name:'普通', color:'#e53935'},{key:'fast', name:'快速', color:'#fdd835'},
      {key:'tank', name:'坦克', color:'#7b1fa2'},{key:'elite', name:'精英', color:'#ff6f00'},
      {key:'shielded', name:'护盾', color:'#4fc3f7'},{key:'healer', name:'治疗', color:'#81c784'},
      {key:'berserker', name:'狂战', color:'#ff1744'},{key:'regen', name:'再生', color:'#66bb6a'},
      {key:'phantom', name:'幽灵', color:'#b39ddb'},{key:'armored', name:'重甲', color:'#78909c'},
      {key:'summoner', name:'召唤', color:'#ff7043'},{key:'saboteur', name:'破坏', color:'#ff5722'},
      {key:'swarm', name:'虫群', color:'#ff8a65'},{key:'splitter', name:'分裂', color:'#ab47bc'},
      {key:'boss', name:'首领', color:'#212121'},{key:'windwolf', name:'疾风狼', color:'#bdbdbd'},
      {key:'spikepig', name:'尖刺猪', color:'#8d6e63'},{key:'rhino', name:'犀牛', color:'#9e9e9e'},
      {key:'shaman', name:'萨满', color:'#a5d6a7'},{key:'flying', name:'飞行', color:'#90caf9'},
      {key:'goblin', name:'宝箱', color:'#ffd700'},{key:'thief', name:'盗贼', color:'#616161'},
      {key:'shadow', name:'暗影', color:'#37474f'},{key:'ninja', name:'忍者', color:'#212121'},
      {key:'exploder', name:'尸爆', color:'#8bc34a'},{key:'banshee', name:'女妖', color:'#e1bee7'},
      {key:'skeleton', name:'骷髅', color:'#eceff1'},{key:'necromancer', name:'死灵', color:'#7e57c2'},
      {key:'gargoyle', name:'石像鬼', color:'#78909c'},{key:'wraith', name:'怨灵', color:'#b39ddb'},
      {key:'fireelem', name:'火元素', color:'#ff5722'},{key:'sandgiant', name:'沙巨人', color:'#d7ccc8'},
      {key:'larva', name:'幼虫', color:'#c5e1a5'},{key:'mosquito', name:'飞蚊', color:'#bdbdbd'},
      {key:'beetle', name:'甲虫', color:'#8d6e63'},{key:'flagbearer', name:'执旗手', color:'#f44336'},
      {key:'brainbug', name:'脑虫', color:'#ce93d8'},{key:'locust', name:'蝗虫', color:'#ffab40'},
      {key:'boomer', name:'自爆蛛', color:'#ff7043'},{key:'scout', name:'侦查', color:'#b0bec5'},
      {key:'irontank', name:'铁甲', color:'#90a4ae'},{key:'portal', name:'传送门', color:'#7c4dff'},
      {key:'skeletonArcher', name:'白骨射',color:'#cfd8dc'},{key:'bear', name:'巨熊', color:'#795548'},
      {key:'pangolin', name:'穿山甲', color:'#a1887f'},{key:'repairdrone', name:'维修', color:'#4fc3f7'},
      {key:'steelwolf', name:'合金狼', color:'#78909c'},{key:'lavahound', name:'熔岩犬', color:'#ff3d00'},
      {key:'elemental', name:'祭司', color:'#ffab40'},{key:'hivequeen', name:'母皇', color:'#6a1b9a'},
      {key:'golem', name:'石魔像', color:'#9e9e9e'},{key:'assassin', name:'刺客', color:'#212121'},
      {key:'druid', name:'德鲁伊', color:'#4caf50'},{key:'mimic', name:'宝箱怪', color:'#ffab00'},
      {key:'slime', name:'史莱姆', color:'#8bc34a'},{key:'warlock', name:'术士', color:'#7c4dff'},
      {key:'owl', name:'猫头鹰', color:'#ffe0b2'},{key:'wolfking', name:'狼王', color:'#b0bec5'},
      {key:'parasite', name:'寄生蜂', color:'#cddc39'},{key:'empr', name:'EMP车', color:'#ffab40'},
      {key:'missile', name:'导弹车', color:'#607d8b'},{key:'nanoswarm', name:'纳米群', color:'#80cbc4'},
      {key:'icehedge', name:'冰刺猬', color:'#81d4fa'},{key:'storm', name:'雷云', color:'#ffeb3b'},
      {key:'watersplit', name:'水幻灵', color:'#64b5f6'},{key:'arcane', name:'奥术傀儡', color:'#7c4dff'},
      {key:'toxant', name:'毒蚁', color:'#aed581'},{key:'hiveguard', name:'蜂巢卫', color:'#ffb74d'},
      {key:'devourer', name:'吞噬者', color:'#a1887f'},{key:'smoker', name:'烟雾弹', color:'#9e9e9e'},
      {key:'hypnotist', name:'催眠师', color:'#b39ddb'},{key:'timechief', name:'时空贼', color:'#4dd0e1'},
      {key:'parrot', name:'鹦鹉', color:'#ef5350'},{key:'tentacle', name:'触手', color:'#ec407a'},
      {key:'archon', name:'仲裁者', color:'#ffd740'},{key:'mirror', name:'镜像者', color:'#e0e0e0'},
    ];
    ctx.font = '10px "Microsoft YaHei"';
    const visibleTypes = previewTypes.filter(function(t){return preview[t.key]>0;});
    const iconsPerRow = 4;
    const iconW = 55;
    const iconH = 16;
    for (let ti = 0; ti < visibleTypes.length; ti++) {
      const t = visibleTypes[ti];
      const row = Math.floor(ti / iconsPerRow);
      const col = ti % iconsPerRow;
      const ix = px + 14 + col * iconW;
      const iy = wpY + 24 + row * iconH;
      if (preview[t.key] <= 0) continue;
      ctx.fillStyle = t.color;
      ctx.beginPath();
      ctx.arc(ix + 6, iy + 6, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#ccc';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.name + '×' + preview[t.key], ix + 14, iy + 6);
    }
  }

  // Combo display (during combat)
  if (gameState.phase === 'combat' && gameState.comboCount >= 3) {
    const comboY = py + 226;
    ctx.fillStyle = '#ff9800';
    ctx.font = 'bold 16px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('🔥 ' + gameState.comboCount + '连杀!', px + PANEL_W/2, comboY + 5);
    const alpha = Math.min(1, gameState.comboTimer / 2.5);
    ctx.globalAlpha = 0.6 * alpha;
    const barW = (PANEL_W - 40) * alpha;
    ctx.fillStyle = '#ff9800';
    ctx.fillRect(px + 20, comboY + 26, barW, 4);
    ctx.globalAlpha = 1;
  }

  // selected tower info
  gameState._upgradeBtns = [];
  if (gameState.selectedPlacedTower) {
    const t = gameState.selectedPlacedTower;
    const cfg = TOWER_CONFIG[t.type];
    const lvl = getTowerLevelConfig(t);
    const curIdx = t._lvlIdx || 0;
    const infoY = py + 248;

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.roundRect(px + 8, infoY, PANEL_W - 16, 250, 6);
    ctx.fill();

    const isL4 = curIdx >= 7;
    ctx.fillStyle = isL4 ? '#ffd700' : cfg.color;
    ctx.font = 'bold 14px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(`${cfg.name} · ${lvl.name}`, px + PANEL_W / 2, infoY + 6);
    if (isL4) {
      ctx.fillStyle = 'rgba(255,215,0,0.5)';
      ctx.font = '9px "Microsoft YaHei"';
      ctx.fillText('⭐ 终极形态 ⭐', px + PANEL_W / 2, infoY + 22);
    }

    // stats
    ctx.fillStyle = '#ccc';
    ctx.font = '11px "Microsoft YaHei"';
    ctx.textAlign = 'left';
    const statX = px + 18;
    const col2X = px + PANEL_W / 2 + 8;
    let sy = infoY + 26;
    ctx.fillText(`伤害: ${lvl.damage}`, statX, sy);
    ctx.fillText(`范围: ${lvl.range} 格`, col2X, sy); sy += 16;
    ctx.fillText(`攻速: ${(1/lvl.cooldown).toFixed(1)}/秒`, statX, sy);
    ctx.fillText(`DPS: ${Math.round(lvl.damage / lvl.cooldown)}`, col2X, sy); sy += 16;
    const dmgLabel = cfg.damageType === 'magic' ? '🔮魔法' : '⚔物理';
    ctx.fillText(`类型: ${dmgLabel}`, statX, sy);
    ctx.fillText(`击杀: ${t.kills || 0}`, col2X, sy); sy += 16;
    const aa = t.type==='arrow'||t.type==='ice'||t.type==='lightning'||t.type==='sniper'||cfg.damageType==='magic';
    ctx.fillStyle = aa ? '#81c784' : '#ef5350';
    ctx.fillText(aa ? '✅ 对空' : '❌ 对空', statX, sy); sy += 14;
    ctx.fillStyle = '#ccc';
    const canHitFlying = t.type === 'arrow' || t.type === 'ice' || t.type === 'lightning' || cfg.damageType === 'magic';
    ctx.fillStyle = canHitFlying ? '#81c784' : '#ef5350';
    ctx.fillText(canHitFlying ? '✅ 对空' : '❌ 对空', statX, sy); sy += 14;
    ctx.fillStyle = '#ccc';
    if (t.armorPen > 0) { ctx.fillText(`穿甲: ${Math.round(t.armorPen*100)}%`, statX, sy); sy += 14; }
    if (t.multiShot > 0) { ctx.fillText(`多重: ${t.multiShot}目标`, statX, sy); sy += 14; }

    if (t.type === 'aura') {
      ctx.fillStyle = '#ffd740';
      ctx.fillText(`伤害加成: +${Math.round((lvl.buffDmg||0)*100)}%`, statX, sy); sy += 14;
      if (lvl.buffSpd) { ctx.fillText(`攻速加成: +${Math.round(lvl.buffSpd*100)}%`, statX, sy); sy += 14; }
      if (lvl.buffRng) { ctx.fillText(`射程加成: +${lvl.buffRng} 格`, statX, sy); sy += 14; }
      if (t.auraHeal) { ctx.fillText(`💚治疗: ${t.auraHeal}/秒`, statX, sy); sy += 14; }
      if (t.auraGoldGen) { ctx.fillText(`💰产金: +${t.auraGoldGen}/3秒`, statX, sy); sy += 14; }
      if (t.auraReflect) { ctx.fillText(`🔄反伤: ${Math.round(t.auraReflect*100)}%`, statX, sy); sy += 14; }
      if (t.lifesteal) { ctx.fillText(`🩸吸血: ${Math.round(t.lifesteal*100)}%`, statX, sy); sy += 14; }
      ctx.fillStyle = '#ccc';
    }
    // Show special features for all tower types
    if (t.critChance > 0) { ctx.fillStyle = '#ffd740'; ctx.fillText(`💥暴击: ${Math.round(t.critChance*100)}% x${t.critMult||2}`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.pierceCount > 0) { ctx.fillStyle = '#64b5f6'; ctx.fillText(`🏹穿透: ${t.pierceCount}个敌人`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.executeThreshold > 0) { ctx.fillStyle = '#ff1744'; ctx.fillText(`💀处决: <${Math.round(t.executeThreshold*100)}%HP`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.goldBonus > 0) { ctx.fillStyle = '#ffd700'; ctx.fillText(`💰赏金: +${t.goldBonus}额外金币`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.fearChance > 0) { ctx.fillStyle = '#ff9800'; ctx.fillText(`😱恐惧: ${Math.round(t.fearChance*100)}% ${t.fearDuration||1}秒`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.knockback > 0) { ctx.fillStyle = '#ff9800'; ctx.fillText(`💨击退: ${Math.round(t.knockback*100)}%格`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.lifesteal > 0) { ctx.fillStyle = '#ef5350'; ctx.fillText(`🩸吸血: ${Math.round(t.lifesteal*100)}%伤害`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.stackingDebuff > 0) { ctx.fillStyle = '#ff7043'; ctx.fillText(`📛增伤: +${Math.round(t.stackingDebuff*100)}%/层`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.rampUpDmg > 0) { ctx.fillStyle = '#ce93d8'; ctx.fillText(`⚡充能: +${Math.round(t.rampUpDmg*100)}%/击`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.shatterChance > 0) { ctx.fillStyle = '#e3f2fd'; ctx.fillText(`💎粉碎: ${Math.round(t.shatterChance*100)}%双倍`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.guardTaunt) { ctx.fillStyle = '#ff9800'; ctx.fillText(`🐂嘲讽: 守卫吸引敌人`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.guardShield > 0) { ctx.fillStyle = '#4fc3f7'; ctx.fillText(`🛡守卫护盾: ${t.guardShield}`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.guardCounter) { ctx.fillStyle = '#ffd740'; ctx.fillText(`⚔反伤: 守卫反弹伤害`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    if (t.guardRallyDmg > 0) { ctx.fillStyle = '#ff9800'; ctx.fillText(`🤝集结: +${Math.round(t.guardRallyDmg*100)}%伤害/友军`, statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }

    if (t.type === 'cannon') {
      const splashPct = Math.round((t.splashDmgMult || 1.0) * 50);
      ctx.fillText(`溅射: ${lvl.splashRadius || cfg.splashRadius}格 (${splashPct}%)`, statX, sy); sy += 14;
      if (lvl.dotDamage) ctx.fillText(`燃烧: ${lvl.dotDamage}/秒`, col2X, sy);
    } else if (t.type === 'ice') {
      ctx.fillText(`减速: ${Math.round(lvl.slowAmount * 100)}%`, statX, sy); sy += 14;
    } else if (t.type === 'lightning') {
      const decayText = t.chainNoDecay ? '无衰减' : '衰减35%';
      ctx.fillText(`连锁: ${lvl.chainCount}目标 (${decayText})`, statX, sy); sy += 14;
    } else if (t.type === 'poison') {
      ctx.fillText(`毒伤: ${lvl.dotDamage}/秒`, statX, sy);
      ctx.fillText(`叠层: ${lvl.maxStacks}`, col2X, sy); sy += 14;
      ctx.fillText(`溅射: ${lvl.splashRadius} 格`, statX, sy); sy += 14;
      if (t.ignoreResist) { ctx.fillStyle = '#a5d6a7'; ctx.fillText('☠无视抗性', statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    } else if (t.type === 'barracks') {
      ctx.fillText(`守卫: ${lvl.guardCount} 个`, statX, sy);
      ctx.fillText(`伤害: ${lvl.damage}`, col2X, sy); sy += 14;
      ctx.fillText(`生命: ${lvl.guardHp} + 波次×4`, statX, sy);
      const spdText = (t.guardSpeedMult || 1) >= 2 ? '⚡快速' : '普通';
      ctx.fillText(`速度: ${spdText}`, col2X, sy); sy += 14;
      if (t.guardHealAura) { ctx.fillStyle = '#81c784'; ctx.fillText('💚治疗光环', statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    } else if (t.type === 'sniper') {
      if (t.shieldBypass) { ctx.fillStyle = '#ffc107'; ctx.fillText('🛡穿透护盾', statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
      else { ctx.fillText(`超远程精准射击`, statX, sy); sy += 14; }
    } else if (t.type === 'flame') {
      ctx.fillText(`灼烧: ${lvl.dotDamage || 0}/秒`, statX, sy);
      ctx.fillText(`溅射: ${lvl.splashRadius || cfg.splashRadius} 格`, col2X, sy); sy += 14;
      if (t.ignoreResist) { ctx.fillStyle = '#ff9800'; ctx.fillText('🔥无视抗性', statX, sy); sy += 14; ctx.fillStyle = '#ccc'; }
    }

    // Branch upgrade buttons
    const maxIdx = cfg.levels.length - 1;
    if (curIdx <= 6) {
      let branchOpts;
      if (curIdx === 0) {
        branchOpts = [{idx: 1, name: cfg.levels[1].name, desc: cfg.levels[1].desc || '', cost: cfg.levels[1].upgradeCost},
                      {idx: 2, name: cfg.levels[2].name, desc: cfg.levels[2].desc || '', cost: cfg.levels[2].upgradeCost}];
      } else if (curIdx === 1 || curIdx === 2) {
        const pair = (cfg.level3Branches || [[3,4],[5,6]])[curIdx - 1];
        const l3cost = Math.floor(cfg.cost * 1.8);
        branchOpts = [
          {idx: pair[0], name: cfg.levels[pair[0]].name, desc: cfg.levels[pair[0]].desc || '', cost: cfg.levels[pair[0]].upgradeCost || l3cost},
          {idx: pair[1], name: cfg.levels[pair[1]].name, desc: cfg.levels[pair[1]].desc || '', cost: cfg.levels[pair[1]].upgradeCost || l3cost},
        ];
      } else {
        // L3→L4: single ultimate upgrade
        const l4Idx = curIdx + 4;
        const l4cost = cfg.levels[l4Idx].upgradeCost || Math.floor(cfg.cost * 2.8);
        branchOpts = [{idx: l4Idx, name: cfg.levels[l4Idx].name, desc: cfg.levels[l4Idx].desc || '', cost: l4cost}];
      }
      // Apply tech discount to displayed costs
      const techDiscount = getTechBonus('discount');
      if (techDiscount > 0) {
        for (const opt of branchOpts) {
          if (opt && opt.cost != null) opt.cost = Math.floor(opt.cost * (1 - techDiscount));
        }
      }
      const uby = infoY + 120;
      const ubh = 24;
      const isSingle = branchOpts.length === 1;
      const ubw = isSingle ? (PANEL_W - 36) : (PANEL_W - 36) / 2;
      for (let bi = 0; bi < branchOpts.length; bi++) {
        const opt = branchOpts[bi];
        if (!opt || opt.cost == null) continue;
        const ubx = isSingle ? (px + 18) : (px + 12 + bi * (ubw + 12));
        const canUpgrade = gameState.gold >= opt.cost;
        gameState._upgradeBtns.push({x: ubx, y: uby, w: ubw, h: ubh, branchIdx: bi});
        ctx.fillStyle = canUpgrade ? (isSingle ? '#ffd700' : (bi === 0 ? '#ff9800' : '#e65100')) : '#444';
        ctx.beginPath();
        ctx.roundRect(ubx, uby, ubw, ubh, 5);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const label = isSingle ? `⭐${opt.name} ${opt.cost}金 终极` : `${opt.name} ${opt.cost}金`;
        ctx.fillText(label, ubx + ubw / 2, uby + ubh / 2 - 4);
        ctx.fillStyle = isSingle ? 'rgba(255,215,0,0.8)' : 'rgba(255,255,255,0.6)';
        ctx.font = '9px "Microsoft YaHei"';
        ctx.fillText(opt.desc, ubx + ubw / 2, uby + ubh / 2 + 9);
      }
    }

    // sell button
    const sby = infoY + 180;
    const sbw = PANEL_W - 40;
    const sbh = 26;
    const sbx = px + 20;
    const sellValue = Math.floor(t.totalInvested * 0.5);
    gameState._sellBtn = {x: sbx, y: sby, w: sbw, h: sbh};
    ctx.fillStyle = '#d32f2f';
    ctx.beginPath();
    ctx.roundRect(sbx, sby, sbw, sbh, 5);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px "Microsoft YaHei"';
    ctx.fillText(`出售 ${sellValue} 金`, sbx + sbw / 2, sby + sbh / 2);
  } else {
    gameState._upgradeBtns = [];
    gameState._sellBtn = null;
  }
  // Tech tree button (always visible in panel)
  {
    const techBtnY = py + MAP_H - 38;
    const techBtnW = PANEL_W - 40;
    const techBtnH = 22;
    const techBtnX = px + 20;
    gameState._techPanelBtn = {x: techBtnX, y: techBtnY, w: techBtnW, h: techBtnH};
    ctx.fillStyle = gameState._techPanelOpen ? '#ff9800' : '#5d4037';
    ctx.beginPath(); ctx.roundRect(techBtnX, techBtnY, techBtnW, techBtnH, 5); ctx.fill();
    ctx.fillStyle = '#ffd740'; ctx.font = 'bold 11px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🔬 科技树 (T键)', techBtnX + techBtnW/2, techBtnY + techBtnH/2);
  }

  // hint at bottom
  if (!gameState._techPanelOpen) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '11px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(gameState.hintText, px + PANEL_W / 2, py + MAP_H - 10);
  }
}

// ── 覆盖层渲染 ──
function renderOverlay() {
  // Pause overlay
  if (gameState.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⏸ 已暂停', CANVAS_W / 2, CANVAS_H / 2 - 10);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '16px "Microsoft YaHei"';
    ctx.fillText('按 P 继续 | 仍可查看塔信息', CANVAS_W / 2, CANVAS_H / 2 + 35);
    return;
  }
  if (gameState.phase !== 'gameover' && gameState.phase !== 'victory') return;

  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (gameState.phase === 'victory') {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 42px "Microsoft YaHei"';
    ctx.fillText('🎉 通关50波！', CANVAS_W / 2, CANVAS_H / 2 - 40);
    ctx.fillStyle = '#e0e0e0';
    ctx.font = '16px "Microsoft YaHei"';
    ctx.fillText('点击继续进入无尽模式', CANVAS_W / 2, CANVAS_H / 2 + 55);
  } else {
    ctx.fillStyle = '#f44336';
    ctx.font = 'bold 42px "Microsoft YaHei"';
    ctx.fillText('💀 游戏结束', CANVAS_W / 2, CANVAS_H / 2 - 40);
  }

  ctx.fillStyle = '#e0e0e0';
  ctx.font = '18px "Microsoft YaHei"';
  const waveLabel = gameState.wave > 50 ? `无尽第${gameState.wave}波` : `第${gameState.wave}波`;
  ctx.fillText(`最终分数: ${gameState.score}  |  到达: ${waveLabel}`, CANVAS_W / 2, CANVAS_H / 2 + 20);

  // restart button
  const rbx = CANVAS_W / 2 - 70;
  const rby = CANVAS_H / 2 + 55;
  const rbw = 140;
  const rbh = 40;
  gameState._restartBtn = {x: rbx, y: rby, w: rbw, h: rbh};

  ctx.fillStyle = '#4caf50';
  ctx.beginPath();
  ctx.roundRect(rbx, rby, rbw, rbh, 8);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px "Microsoft YaHei"';
  ctx.fillText('🔄 再来一局', CANVAS_W / 2, rby + rbh / 2);
}

// ═══════════ 塔逻辑 ═══════════

  const discount = getTechBonus('discount');
  let actualCost = Math.floor(cfg.cost * (1 - discount));
