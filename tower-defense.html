function handleOverlayClick() {
  const mx = gameState.mouseX;
  const my = gameState.mouseY;

  // Victory: click to continue into endless mode
  if (gameState.phase === 'victory') {
    gameState.phase = 'build';
    gameState.hintText = '无尽模式已开启！';
    return;
  }

  if (!gameState._restartBtn) return;
  const btn = gameState._restartBtn;
  if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
    restartGame();
  }
}

document.addEventListener('keydown', (e) => {
  if (gameState.phase === 'gameover') {
    if (e.key === 'r' || e.key === 'R') restartGame();
    return;
  }
  if (gameState.phase === 'victory') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); gameState.phase = 'build'; gameState.hintText = '无尽模式已开启！'; }
    return;
  }

  switch (e.key) {
    case '1': gameState.selectedTowerType = 'arrow'; gameState.selectedPlacedTower = null; break;
    case '2': gameState.selectedTowerType = 'cannon'; gameState.selectedPlacedTower = null; break;
    case '3': gameState.selectedTowerType = 'ice'; gameState.selectedPlacedTower = null; break;
    case '4': gameState.selectedTowerType = 'lightning'; gameState.selectedPlacedTower = null; break;
    case '5': gameState.selectedTowerType = 'poison'; gameState.selectedPlacedTower = null; break;
    case '6': gameState.selectedTowerType = 'barracks'; gameState.selectedPlacedTower = null; break;
    case '7': gameState.selectedTowerType = 'sniper'; gameState.selectedPlacedTower = null; break;
    case '8': gameState.selectedTowerType = 'flame'; gameState.selectedPlacedTower = null; break;
    case '9': gameState.selectedTowerType = 'aura'; gameState.selectedPlacedTower = null; break;
    case '0': gameState.selectedTowerType = 'laser'; gameState.selectedPlacedTower = null; break;
    case 't': case 'T':
      gameState._techPanelOpen = !gameState._techPanelOpen;
      gameState._techNodeBtns = [];
      gameState._techSelected = null;
      gameState.hintText = gameState._techPanelOpen ? '科技树已打开，按T关闭' : '科技树已关闭';
      break;
    case 'm':
      if (e.ctrlKey || e.metaKey) break;
      gameState._mapEditMode = !gameState._mapEditMode;
      if (gameState._mapEditMode) {
        gameState._mapEditWaypoints = [];
        gameState.hintText = '🗺 地图编辑模式：点地图加路径点，按M导出';
      } else {
        const wps = gameState._mapEditWaypoints;
        if (wps.length > 0) {
          const code = wps.map(c => '{col:' + c.col + ',row:' + c.row + '}').join(',\n  ');
          console.log('=== 路径点坐标 (复制以下内容) ===\n' + code + '\n=== ' + wps.length + '个点 ===');
          gameState.hintText = '已导出 ' + wps.length + ' 个点到控制台(F12)，按M重新编辑';
        }
      }
      break;
    case 'Escape':
      if (gameState._techPanelOpen) { gameState._techPanelOpen = false; gameState._techNodeBtns = []; break; }
      gameState.selectedTowerType = null;
      gameState.selectedPlacedTower = null;
      gameState.hintText = '选择塔类型，点击地图放置';
      break;
    case ' ':
      e.preventDefault();
      if (gameState.paused) break;
      gameState.speedMultiplier = gameState.speedMultiplier >= 4 ? 1 : gameState.speedMultiplier + 1;
      break;
    case 'p':
    case 'P':
      gameState.paused = !gameState.paused;
      gameState.hintText = gameState.paused ? '⏸ 游戏已暂停 — 按P继续' : '▶ 游戏继续';
      break;
    case 's':
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); if (gameState.lives > 0) saveGame(); else gameState.hintText = '游戏已结束，无法保存'; break; }
      break;
    case 'l':
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); if (hasSave()) loadGame(); break; }
      break;
  }
});

// ═══════════ 主循环 ═══════════
let lastTimestamp = 0;
let _fpsCounter = 0, _fpsTime = 0, _currentFps = 60;

function gameLoop(timestamp) {
  _fpsCounter++;
  if (timestamp - _fpsTime >= 1000) {
    _currentFps = _fpsCounter;
    _fpsCounter = 0;
    _fpsTime = timestamp;
  }
  if (lastTimestamp === 0) lastTimestamp = timestamp;
  let dt = (timestamp - lastTimestamp) / 1000;
  lastTimestamp = timestamp;
  dt = Math.min(dt, 0.1); // cap to prevent spiral of death

  try {
    update(dt * gameState.speedMultiplier);
    cleanupEntities();
    render();
  } catch(e) {
    console.error('Game loop error:', e);
    gameState.hintText = '❌错误: ' + (e.message || 'unknown');
    gameState._debugClickResult = '❌游戏循环错误: ' + e.message;
    // Don't re-throw; keep rendering the frozen state
  }

  requestAnimationFrame(gameLoop);
}

function update(dt) {
  if (gameState.paused) return;
  if (gameState.phase === 'combat') {
    updateSpawning(dt);
    updateEnemies(dt);
    updateSpatialGrid();
    updateTowers(dt);
    updateProjectiles(dt);
    // combo timer decay
    if (gameState.comboTimer > 0) {
      gameState.comboTimer -= dt;
      if (gameState.comboTimer <= 0) gameState.comboCount = 0;
    }
    // passive gold income: scales slowly with wave, capped at 6/sec + tech bonus
    gameState._passiveGoldAcc += dt;
    const techPassiveG = getTechBonus('passiveG');
    const passiveRate = Math.min(1 + Math.floor(gameState.wave / 8), 6) + techPassiveG;
    while (gameState._passiveGoldAcc >= 1.0) {
      gameState._passiveGoldAcc -= 1.0;
      gameState.gold += Math.floor(passiveRate);
    }
    // Passive tech point generation (very slow: 0.01/sec base)
    if (!gameState._techPassiveAcc) gameState._techPassiveAcc = 0;
    gameState._techPassiveAcc += dt;
    while (gameState._techPassiveAcc >= 10.0) {
      gameState._techPassiveAcc -= 10.0;
      addTechPoints(0.1);
    }
    checkWaveComplete();
    checkGameOver();
  }

  updateTraps(dt);
  updateSplashFX(dt);
  updateGuards(dt);
  updateParticles(dt);
  updateFloatingTexts(dt);
}

function updateTowers(dt) {
  // Reset buffs and apply tech regen
  for (const tower of gameState.towers) {
    tower.buffDmgMul = 1.0;
    tower.buffSpdMul = 1.0;
    tower.buffRngAdd = 0;
    // Tech: tower regen
    if (tower._techRegen > 0 && tower.hp < tower.maxHp && !tower.disabled) {
      tower.hp = Math.min(tower.maxHp, tower.hp + Math.floor(tower.maxHp * tower._techRegen * dt));
    }
  }
  // Apply aura tower buffs
  for (const t of gameState.towers) {
    if (t.type !== 'aura' || t.disabled) continue;
    const lvl = getTowerLevelConfig(t);
    const pos = {x: t._px || 0, y: t._py || 0};
    if (!pos.x) { const p = gridToPixel(t.col, t.row); pos.x = p.x; pos.y = p.y; t._px = p.x; t._py = p.y; }
    const auraRange = lvl.range * CELL_SIZE;
    for (const other of gameState.towers) {
      if (other === t || other.type === 'aura') continue;
      const opos = {x: other._px || 0, y: other._py || 0};
      if (!opos.x) { const p = gridToPixel(other.col, other.row); opos.x = p.x; opos.y = p.y; other._px = p.x; other._py = p.y; }
      if (distSq(pos, opos) <= auraRange * auraRange) {
        other.buffDmgMul = Math.max(other.buffDmgMul, 1 + (lvl.buffDmg || 0));
        other.buffSpdMul = Math.max(other.buffSpdMul, 1 + (lvl.buffSpd || 0));
        other.buffRngAdd = Math.max(other.buffRngAdd, lvl.buffRng || 0);
        // Aura heal: passive HP regen for nearby towers
        if (t.auraHeal > 0) {
          other.hp = Math.min(other.maxHp, other.hp + t.auraHeal * dt);
        }
        // Aura reflect: reflect damage to enemies (always apply, damageTower handles the rest)
        if (t.auraReflect > 0) {
          other._reflectBuff = t.auraReflect;
        }
        // Aura gold gen: slow passive gold per tower
        if (t.auraGoldGen > 0 && !other._auraGoldTimer) {
          other._auraGoldTimer = 3.0;
        }
      }
    }
  }

  for (const tower of gameState.towers) {
    // HP regeneration (slow passive heal 1% maxHP/sec)
    if (tower.hp < tower.maxHp) {
      tower.hp = Math.min(tower.maxHp, tower.hp + tower.maxHp * 0.01 * dt);
    }
    // Aura gold generation timer
    if (tower._auraGoldTimer !== undefined && tower._auraGoldTimer > 0) {
      tower._auraGoldTimer -= dt;
      if (tower._auraGoldTimer <= 0) {
        tower._auraGoldTimer = 3.0;
        // Find the aura tower giving this buff
        for (const auraT of gameState.towers) {
          if (auraT.type === 'aura' && auraT.auraGoldGen > 0 && !auraT.disabled) {
            const d = dist(gridToPixel(auraT.col, auraT.row), gridToPixel(tower.col, tower.row));
            if (d <= auraT.range * CELL_SIZE) {
              gameState.gold += auraT.auraGoldGen;
              break;
            }
          }
        }
      }
    }
    // retaliate slow recovery (dt-based)
    if (tower._retaliateSlowTimer > 0) {
      tower._retaliateSlowTimer -= dt;
      if (tower._retaliateSlowTimer <= 0 && tower.attackCooldown > tower._origAttackCd) {
        tower.attackCooldown = tower._origAttackCd;
      }
    }
    if (tower._retaliateSlowTimer > 0) { tower._retaliateSlowTimer -= dt; if (tower._retaliateSlowTimer <= 0 && tower.attackCooldown > tower._origAttackCd) tower.attackCooldown = tower._origAttackCd; }
    // disabled timer countdown
    if (tower.disabled) {
      tower.disabledTimer -= dt;
      if (tower.disabledTimer <= 0) tower.disabled = false;
      continue;
    }

    if (tower.type === 'laser') {
      const lcfg=TOWER_CONFIG.laser;const lvl=getTowerLevelConfig(tower);
      const lt=lvl.lockTime||lcfg.lockTime||0.2, mh=lvl.maxHeatStacks||lcfg.maxHeatStacks||20, hp=lvl.heatPerStack||lcfg.heatPerStack||0.08;
      if(!tower._baseMaxHeat)tower._baseMaxHeat=mh;
      const tpos=gridToPixel(tower.col,tower.row),rpx=(tower.range+(tower.buffRngAdd||0))*CELL_SIZE,mb=lvl.multiBeam||1;
      if(!tower._beamTargets)tower._beamTargets=[];
      if(tower._beamTargets.length===0||!tower._beamTargets[0]||!tower._beamTargets[0].alive){
        tower._beamTargets=[];tower._beamLockTimer=0;tower._beamActive=false;
        const all=[];for(const e of gameState.enemies){if(e.alive&&!e._burrowed&&dist(tpos,e)<=rpx)all.push(e);}
        all.sort((a,b)=>b.pathProgress-a.pathProgress);
        for(let i=0;i<Math.min(mb,all.length);i++)tower._beamTargets.push(all[i]);
        if(tower._beamTargets.length>0)tower._beamTarget=tower._beamTargets[0];
      }
      if(tower._beamTargets.length>0&&!tower._beamActive){tower._beamLockTimer=(tower._beamLockTimer||0)+dt;if(tower._beamLockTimer>=lt){tower._beamActive=true;tower._heatStacks=0;tower._heatTimer=0;}}
      if(tower._beamActive&&tower._beamTargets.length>0){
        let anyA=false;
        for(let bi=0;bi<tower._beamTargets.length;bi++){
          const tg=tower._beamTargets[bi];if(!tg||!tg.alive)continue;if(dist(tpos,tg)>rpx)continue;anyA=true;
          const bd=tower.damage*dt*(tower.buffDmgMul||1.0),dm=lvl.beamDmgFalloff||1.0;
          let wm=1;if(lvl.executeThreshold&&tg.hp<=tg.maxHp*lvl.executeThreshold)wm=2;
          tower._beamDmgAcc=(tower._beamDmgAcc||0)+bd*dm*wm;
          const td=Math.floor(tower._beamDmgAcc);
          if(td>0){tower._beamDmgAcc-=td;damageEnemy(tg,td,tower,'magic');}
          if(lvl.shieldBreak&&tg.shield>0)tg.shield=Math.max(0,tg.shield-lvl.shieldBreak*dt*10);
          tower._heatTimer=(tower._heatTimer||0)+dt;
          const hs=(lvl.bossDoubleHeat&&(tg.type==='boss'||tg.maxHp>=500))?2:1;
          if(tower._heatTimer>=0.5/hs&&tower._heatStacks<mh){tower._heatStacks=(tower._heatStacks||0)+hs;tower._heatTimer=0;tower.damage=Math.floor(lvl.damage*(1+tower._heatStacks*hp));}
        }
        if(!anyA){
          if(lvl.chainRefract){let nr=null,nd=rpx*1.5;for(const e of gameState.enemies){if(!e.alive)continue;const d=dist(tpos,e);if(d<nd){nd=d;nr=e;}}if(nr){tower._beamTargets=[nr];tower._beamTarget=nr;tower._beamActive=true;tower._beamLockTimer=lt;tower._heatStacks=Math.floor(tower._heatStacks*0.5);tower._heatTimer=0;tower.damage=Math.floor(lvl.damage*(1+tower._heatStacks*hp));spawnFloatingText(nr.x,nr.y-nr.size,'↻折射!','#ea80fc');}else{tower._beamActive=false;tower._beamTargets=[];}}
          else if(lvl.heatExplode&&tower._heatStacks>0){const exD=tower._heatStacks*5,exR=CELL_SIZE*2.0;for(const e of gameState.enemies){if(!e.alive)continue;if(dist(tower._beamTarget||tpos,e)<exR){damageEnemy(e,exD,tower,'magic');}}gameState._splashFX=gameState._splashFX||[];gameState._splashFX.push({x:(tower._beamTarget||tpos).x,y:(tower._beamTarget||tpos).y,radius:exR,life:0.5,maxLife:0.5,type:'laser'});tower._beamActive=false;tower._beamTargets=[];tower._heatStacks=0;tower.damage=lvl.damage;}
          else{tower._beamActive=false;tower._beamTargets=[];tower._heatStacks=Math.max(0,(tower._heatStacks||0)-1);tower.damage=Math.floor(lvl.damage*(1+tower._heatStacks*hp));}
        }
      }
      if(tower._beamTarget&&tower._beamTarget.alive){const ta=Math.atan2(tower._beamTarget.y-tpos.y,tower._beamTarget.x-tpos.x);const diff=ta-(tower.angle||0);tower.angle=(tower.angle||0)+((diff+Math.PI*3)%(Math.PI*2)-Math.PI)*Math.min(1,dt*8);}
      continue;
    }
    // aura towers don't attack
    if (tower.type === 'aura') continue;

    // curse timer countdown
    if (tower.curseTimer > 0) {
      tower.curseTimer -= dt;
      if (tower.curseTimer <= 0) tower.curseAmount = 0;
    }

    tower.cooldownRemaining -= dt;

    // barracks tower: spawn guards instead of projectiles
    if (tower.type === 'barracks' && tower.cooldownRemaining <= 0) {
      // count alive guards for this tower
      let aliveGuards = 0;
      for (const g of gameState.guards) {
        if (g.alive && g.tower === tower) aliveGuards++;
      }
      if (aliveGuards < tower.guardCount) {
        const tpos = gridToPixel(tower.col, tower.row);
        const g = ObjectPool.acquire('guard') || {};
        Object.assign(g, {
          x: tpos.x + (Math.random() - 0.5) * 20,
          y: tpos.y + (Math.random() - 0.5) * 20,
          tower, hp: tower.guardHp + gameState.wave * 4,
          maxHp: tower.guardHp + gameState.wave * 4,
          damage: tower.damage,
          speed: 120 * (tower.guardSpeedMult || 1.0),
          life: 999, maxLife: 999,
          target: null, attackTimer: 0,
          patrolAngle: Math.random() * Math.PI * 2,
          alive: true, _healCooldown: 0,
        });
        // Guard shield (皇家卫)
        if (tower.guardShield > 0) g.shield = tower.guardShield;
        gameState.guards.push(g);
      }
      tower.cooldownRemaining = tower.attackCooldown / (tower.buffSpdMul || 1.0);
      continue;
    }

    // find or validate target
    if (!tower.target || !tower.target.alive) {
      tower.target = findTarget(tower);
    } else {
      // check if target still in range
      const pos = gridToPixel(tower.col, tower.row);
      if (distSq(pos, tower.target) > Math.pow((tower.range + (tower.buffRngAdd || 0)) * CELL_SIZE, 2)) {
        tower.target = findTarget(tower);
      }
    }

    const tpos = gridToPixel(tower.col, tower.row);
    if (tower.target) {
      const targetAngle = Math.atan2(tower.target.y - tpos.y, tower.target.x - tpos.x);
      const diff = targetAngle - tower.angle;
      const shortDiff = ((diff + Math.PI*3) % (Math.PI*2)) - Math.PI;
      tower.angle += shortDiff * Math.min(1, dt * 12);
    }

    if (tower.target && tower.cooldownRemaining <= 0) {
      spawnProjectile(tower, tower.target);
      // multiShot: fire at additional targets (arrow tower 散射 branch)
      if (tower.multiShot > 1) {
        const rangePx = (tower.range + (tower.buffRngAdd || 0)) * CELL_SIZE;
        const rangeSq2 = rangePx * rangePx;
        const extraTargets = [];
        for (const enemy of gameState.enemies) {
          if (!enemy.alive || enemy === tower.target || enemy._burrowed) continue;
          if (enemy.flying && tower.type !== 'arrow' && tower.type !== 'ice' && tower.type !== 'lightning' && tower.type !== 'sniper' && tower.damageType !== 'magic') continue;
          if (enemy.stealthRange && distSq(tpos, enemy) > (enemy.stealthRange * CELL_SIZE) * (enemy.stealthRange * CELL_SIZE)) continue;
          const dSq2 = distSq(tpos, enemy);
          if (dSq2 <= rangeSq2) extraTargets.push({enemy, d: Math.sqrt(dSq2)});
        }
        extraTargets.sort((a, b) => a.d - b.d);
        for (let i = 0; i < Math.min(tower.multiShot - 1, extraTargets.length); i++) {
          spawnProjectile(tower, extraTargets[i].enemy);
        }
      }
      tower.cooldownRemaining = tower.attackCooldown / (tower.buffSpdMul || 1.0);
    }
  }
}

// ═══════════ 科技树面板渲染（小球 + 悬浮提示）══════════
function renderTechPanel() {
  // Semi-transparent overlay
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  const px = 30, py = 29, pw = CANVAS_W - 60, ph = CANVAS_H - 55;
  gameState._techPanelBounds = {x: px, y: py, w: pw, h: ph};
  ctx.fillStyle = '#16213e';
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 10); ctx.fill();
  ctx.strokeStyle = '#0f3460'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 10); ctx.stroke();

  // Title
  ctx.fillStyle = '#ffd740'; ctx.font = 'bold 17px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('🔬 科技树', px + pw/2, py + 6);
  ctx.fillStyle = '#aaa'; ctx.font = '10px "Microsoft YaHei"';
  const tp2 = gameState.techPoints;
  ctx.fillText('科技点数: ' + (Number.isInteger(tp2) ? tp2 : tp2.toFixed(1)) + '  |  T关闭  |  悬停小球查看详情', px + pw/2, py + 25);

  // Damage display toggle (always accessible, even with tech panel open)
  const dmgBtnW = 58, dmgBtnH = 18;
  const dmgBtnX = px + pw - dmgBtnW - 14, dmgBtnY = py + 6;
  const modeLabels = {off: '伤害:关', single: '伤害:单个', total: '伤害:累积'};
  const modeColors = {off: '#555', single: '#ff9800', total: '#4caf50'};
  ctx.fillStyle = modeColors[gameState._dmgDisplayMode] || '#555';
  ctx.beginPath(); ctx.roundRect(dmgBtnX, dmgBtnY, dmgBtnW, dmgBtnH, 4); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 8px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(modeLabels[gameState._dmgDisplayMode] || '伤害:单个', dmgBtnX + dmgBtnW/2, dmgBtnY + dmgBtnH/2);
  gameState._techDmgBtn = {x: dmgBtnX, y: dmgBtnY, w: dmgBtnW, h: dmgBtnH};

  // Init
  gameState._techNodeBtns = [];

  // 3 branch columns
  var branches = ['A','B','C'];
  var colW = (pw - 80) / 3;
  var colX = [px + 18, px + 18 + colW + 22, px + 18 + (colW + 22) * 2];
  var orbR = 14, orbD = orbR * 2;
  var orbGapX = 10;
  var tierGapY = 18;
  var startY = py + 44;

  // Pre-compute node depths & tier grouping
  var branchDepths = {};
  var branchTiers = {};
  var nodePos = {}; // {branchId: {nodeId: {cx, cy}}}
  var brColorMap = {A:'#f44336', B:'#4caf50', C:'#ffd740'};

  for (var bi = 0; bi < branches.length; bi++) {
    var brId = branches[bi];
    branchDepths[brId] = computeNodeDepths(brId);
    branchTiers[brId] = {};
    nodePos[brId] = {};
    var nids = Object.keys(TECH_CONFIG.branches[brId].nodes);
    for (var ni = 0; ni < nids.length; ni++) {
      var d = branchDepths[brId][nids[ni]];
      if (!branchTiers[brId][d]) branchTiers[brId][d] = [];
      branchTiers[brId][d].push(nids[ni]);
    }
  }

  // ── Pass 1: Layout nodes ──
  var branchEndY = {};
  for (var bi = 0; bi < branches.length; bi++) {
    var brId = branches[bi];
    var tiers = branchTiers[brId];
    var depthKeys = Object.keys(tiers).map(Number);
    var maxDepth = depthKeys.length > 0 ? Math.max.apply(null, depthKeys) : 0;
    var colLeft = colX[bi];
    var colWidth = colW;
    var curY = startY + 18;

    for (var d = 0; d <= maxDepth; d++) {
      var tierNodes = tiers[d] || [];
      if (tierNodes.length === 0) { curY += orbD + tierGapY; continue; }
      var totalW = tierNodes.length * orbD + (tierNodes.length - 1) * orbGapX;
      var startX = colLeft + (colWidth - totalW) / 2;
      for (var ni = 0; ni < tierNodes.length; ni++) {
        nodePos[brId][tierNodes[ni]] = {
          cx: startX + ni * (orbD + orbGapX) + orbR,
          cy: curY + orbR
        };
      }
      curY += orbD + tierGapY;
    }
    branchEndY[brId] = curY;
  }

  // ── Pass 2: Draw connection lines (behind orbs) ──
  for (var bi = 0; bi < branches.length; bi++) {
    var brId = branches[bi];
    var brCfg = TECH_CONFIG.branches[brId];
    var nids = Object.keys(brCfg.nodes);
    for (var ni = 0; ni < nids.length; ni++) {
      var nid = nids[ni];
      var node = brCfg.nodes[nid];
      var childPos = nodePos[brId][nid];
      if (!childPos) continue;
      var preKeys = Object.keys(node.pre);
      for (var pi = 0; pi < preKeys.length; pi++) {
        var pk = preKeys[pi];
        var parentPos = nodePos[brId][pk];
        if (!parentPos) continue;
        var preMet = getTechLevel(brId, pk) >= node.pre[pk];
        ctx.strokeStyle = preMet ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.06)';
        ctx.lineWidth = preMet ? 1.2 : 0.7;
        ctx.setLineDash(preMet ? [] : [3, 3]);
        ctx.beginPath();
        var midY = (childPos.cy - orbR + parentPos.cy + orbR) / 2;
        ctx.moveTo(childPos.cx, childPos.cy - orbR);
        ctx.lineTo(childPos.cx, midY);
        ctx.lineTo(parentPos.cx, midY);
        ctx.lineTo(parentPos.cx, parentPos.cy + orbR);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  // ── Pass 3: Branch headers & orbs ──
  for (var bi = 0; bi < branches.length; bi++) {
    var brId = branches[bi];
    var brCfg = TECH_CONFIG.branches[brId];
    var colLeft = colX[bi];
    var colWidth = colW;
    var brColor = brColorMap[brId];

    // Branch header
    ctx.fillStyle = brColor;
    ctx.font = 'bold 13px "Microsoft YaHei"'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(brCfg.icon + ' ' + brCfg.name, colLeft, startY);
    var totalInBranch = getBranchTotal(brId);
    ctx.fillStyle = '#999'; ctx.font = '9px "Microsoft YaHei"'; ctx.textAlign = 'right';
    ctx.fillText('已投入: ' + totalInBranch + '点', colLeft + colWidth - 10, startY + 1);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(colLeft, startY + 16, colWidth - 10, 1);

    // Draw orbs
    var nids = Object.keys(brCfg.nodes);
    for (var ni = 0; ni < nids.length; ni++) {
      var nid = nids[ni];
      var node = brCfg.nodes[nid];
      var pos = nodePos[brId][nid];
      if (!pos) continue;

      var curLv = getTechLevel(brId, nid);
      var canUp = canUpgradeTechNode(brId, nid);
      var isMax = curLv >= node.max;
      var isSelected = gameState._techSelected && gameState._techSelected.branch === brId && gameState._techSelected.id === nid;

      // Store for click detection
      gameState._techNodeBtns.push({
        x: pos.cx - orbR - 3, y: pos.cy - orbR - 3,
        w: orbD + 6, h: orbD + 6,
        branch: brId, nodeId: nid
      });

      // Orb fill
      if (curLv > 0) {
        var alpha = 0.3 + (curLv / node.max) * 0.55;
        ctx.fillStyle = brId === 'A' ? 'rgba(244,67,54,' + alpha + ')' : brId === 'B' ? 'rgba(76,175,80,' + alpha + ')' : 'rgba(255,215,64,' + alpha + ')';
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
      }
      ctx.beginPath(); ctx.arc(pos.cx, pos.cy, orbR, 0, Math.PI * 2); ctx.fill();

      // Orb border
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
      if (isSelected) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
      } else if (canUp && !isMax) {
        ctx.strokeStyle = '#ffd740'; ctx.lineWidth = 2;
        ctx.shadowColor = '#ffd740'; ctx.shadowBlur = 6;
      } else if (isMax) {
        ctx.strokeStyle = brColor; ctx.lineWidth = 1.5;
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
      }
      ctx.beginPath(); ctx.arc(pos.cx, pos.cy, orbR, 0, Math.PI * 2); ctx.stroke();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

      // Orb label: node number
      var nodeNum = nid.replace(/[ABC]/, '');
      ctx.fillStyle = curLv > 0 ? '#fff' : '#888';
      ctx.font = 'bold 10px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(nodeNum, pos.cx, pos.cy + 1);

      // Level dots around orb
      if (node.max > 1 && curLv > 0) {
        for (var d = 0; d < node.max; d++) {
          var angle = -Math.PI / 2 + (d / node.max) * Math.PI * 2;
          var dotX = pos.cx + Math.cos(angle) * (orbR + 5);
          var dotY = pos.cy + Math.sin(angle) * (orbR + 5);
          ctx.fillStyle = d < curLv ? brColor : 'rgba(255,255,255,0.12)';
          ctx.beginPath(); ctx.arc(dotX, dotY, 1.8, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }

  // ── Combo nodes section ──
  var maxBranchEndY = Math.max(branchEndY.A || 0, branchEndY.B || 0, branchEndY.C || 0);
  var comboY = maxBranchEndY + 12;
  if (comboY < py + ph - 50) {
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(px + 12, comboY, pw - 24, py + ph - comboY - 6);
    ctx.fillStyle = '#ffd740'; ctx.font = 'bold 12px "Microsoft YaHei"'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('🔗 联合科技节点', px + 20, comboY + 5);

    var comboW = 175, comboH = 54;
    for (var ci = 0; ci < TECH_CONFIG.branches.combos.length; ci++) {
      var combo = TECH_CONFIG.branches.combos[ci];
      var curLv = gameState.tech.combos[combo.id] || 0;
      var canUp = canUpgradeComboNode(combo);
      var isMax = curLv >= combo.max;
      var cxCombo = px + 22 + ci * (comboW + 6);
      var cyCombo = comboY + 20;
      if (cxCombo + comboW > px + pw - 8) break;

      gameState._techNodeBtns.push({x: cxCombo, y: cyCombo, w: comboW, h: comboH, branch: 'combos', nodeId: combo.id});

      ctx.fillStyle = curLv > 0 ? 'rgba(255,152,0,0.32)' : 'rgba(255,255,255,0.06)';
      ctx.beginPath(); ctx.roundRect(cxCombo, cyCombo, comboW, comboH, 5); ctx.fill();
      if (canUp && !isMax) { ctx.strokeStyle = '#ffd740'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(cxCombo, cyCombo, comboW, comboH, 5); ctx.stroke(); }
      if (isMax) { ctx.strokeStyle = '#ffd740'; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(cxCombo, cyCombo, comboW, comboH, 5); ctx.stroke(); }

      ctx.fillStyle = '#fff'; ctx.font = 'bold 10px "Microsoft YaHei"'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(combo.icon + ' ' + combo.name, cxCombo + 7, cyCombo + 4);
      ctx.fillStyle = '#bbb'; ctx.font = '8px "Microsoft YaHei"';
      ctx.fillText(combo.desc, cxCombo + 7, cyCombo + 17);
      var reqKeys = Object.keys(combo.req);
      var reqText = '';
      for (var ri = 0; ri < reqKeys.length; ri++) {
        var rk = reqKeys[ri];
        reqText += TECH_CONFIG.branches[rk].name + combo.req[rk] + '点';
        if (ri < reqKeys.length - 1) reqText += '+';
      }
      var lvText2 = isMax ? 'MAX' : ('Lv' + curLv + '/' + combo.max);
      ctx.fillStyle = isMax ? '#888' : '#aaa'; ctx.font = '7px "Microsoft YaHei"';
      ctx.fillText(lvText2 + ' | 需求: ' + reqText, cxCombo + 7, cyCombo + 29);
      if (!isMax) {
        ctx.fillStyle = canUp ? '#ffd740' : '#f44336';
        ctx.font = '8px "Microsoft YaHei"';
        ctx.fillText(TECH_CONFIG.costs[curLv] + '⭐', cxCombo + 7, cyCombo + 40);
      }
      var allMet = true;
      var reqKeys2 = Object.keys(combo.req);
      for (var ri2 = 0; ri2 < reqKeys2.length; ri2++) {
        if (getBranchTotal(reqKeys2[ri2]) < combo.req[reqKeys2[ri2]]) { allMet = false; break; }
      }
      ctx.fillStyle = allMet ? '#4caf50' : '#555';
      ctx.font = '14px "Microsoft YaHei"'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(allMet ? '✓' : '✗', cxCombo + comboW - 10, cyCombo + comboH / 2);
    }
  }

  // ── Hover tooltip (semi-transparent floating window) ──
  var mx = gameState.mouseX, my = gameState.mouseY;
  var hoveredNode = null;
  for (var bi = 0; bi < branches.length; bi++) {
    var brId = branches[bi];
    for (var nid in nodePos[brId]) {
      var p = nodePos[brId][nid];
      var dx = mx - p.cx, dy = my - p.cy;
      if (Math.sqrt(dx * dx + dy * dy) <= orbR + 2) {
        hoveredNode = {branch: brId, nodeId: nid, cx: p.cx, cy: p.cy};
        break;
      }
    }
    if (hoveredNode) break;
  }

  if (hoveredNode) {
    var brId = hoveredNode.branch;
    var nid = hoveredNode.nodeId;
    var node = TECH_CONFIG.branches[brId].nodes[nid];
    var curLv = getTechLevel(brId, nid);
    var canUp = canUpgradeTechNode(brId, nid);
    var isMax = curLv >= node.max;
    var brCfg = TECH_CONFIG.branches[brId];
    var brColor = brColorMap[brId];

    // Tooltip dimensions
    var tipW = 185, tipH = 118;
    var tipX = hoveredNode.cx + orbR + 10;
    var tipY = hoveredNode.cy - tipH / 2;
    // Keep within panel
    if (tipX + tipW > px + pw - 5) tipX = hoveredNode.cx - orbR - tipW - 10;
    if (tipY < py + 3) tipY = py + 3;
    if (tipY + tipH > py + ph - 3) tipY = py + ph - tipH - 3;

    // Background
    ctx.fillStyle = 'rgba(10,10,30,0.93)';
    ctx.beginPath(); ctx.roundRect(tipX, tipY, tipW, tipH, 7); ctx.fill();
    ctx.strokeStyle = brColor; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(tipX, tipY, tipW, tipH, 7); ctx.stroke();

    var tx = tipX + 10, ty = tipY + 7;

    // Title: icon + name + level
    ctx.fillStyle = brColor; ctx.font = 'bold 12px "Microsoft YaHei"'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(brCfg.icon + ' ' + nid + ' ' + node.name, tx, ty);
    ty += 16;

    // Level badge
    var lvText3 = isMax ? ('✦ MAX Lv' + node.max) : ('Lv' + curLv + '/' + node.max);
    ctx.fillStyle = isMax ? '#ffd740' : '#ccc'; ctx.font = '9px "Microsoft YaHei"';
    ctx.fillText(lvText3, tx, ty);
    ty += 12;

    // Description
    ctx.fillStyle = '#bbb'; ctx.font = '9px "Microsoft YaHei"';
    ctx.fillText(node.desc, tx, ty);
    ty += 12;

    // Effect value
    var effNames = {dmg:'伤害',spd:'攻速',range:'射程',crit:'暴击率',splash:'溅射',pierce:'穿透',physDmg:'物理伤害',magDmg:'魔法伤害',chain:'连锁',ricochet:'弹射',execute:'处决',critDmg:'暴伤',allDmg:'全伤害',ultPrec:'精准',ultCrit:'毁灭',lives:'生命',shield:'护盾',towerHp:'塔血',regen:'恢复',dmgRes:'减伤',guardHp:'守卫血',slowImm:'免疫减速',curseRes:'诅咒抗',rebirth:'重生',reflect:'反弹',armor:'护甲',lastStand:'最后防线',immortal:'不朽',thornAura:'反伤',holyRev:'神圣守护',startGold:'初始金币',killGold:'击杀金币',passiveG:'被动收入',waveBonus:'波次奖励',discount:'折扣',interest:'利息',firstHalf:'首塔半价',techRate:'科技加速',comboGold:'连杀金币',sellVal:'出售价值',waveTP:'波次科技',rich:'暴富',dropGold:'掉落金币',freeUp:'免费升级',allGold:'全金币'};
    var effName = effNames[node.eff] || node.eff;
    var effStr;
    if (node.val < 0.1) { effStr = effName + ' +' + (node.val * 100) + '%/级'; }
    else if (node.val >= 1 && Number.isInteger(node.val)) { effStr = effName + ' +' + node.val + '/级'; }
    else { effStr = effName + ' +' + Math.round(node.val * 100) + '%/级'; }
    ctx.fillStyle = '#aaa'; ctx.font = '8px "Microsoft YaHei"';
    ctx.fillText('效果: ' + effStr, tx, ty);
    ty += 11;

    // Current bonus
    if (curLv > 0) {
      var totalVal = curLv * node.val;
      var totalStr;
      if (totalVal < 0.1) { totalStr = '当前: +' + Math.round(totalVal * 1000) / 10 + '%'; }
      else if (totalVal >= 1 && Number.isInteger(totalVal)) { totalStr = '当前: +' + totalVal; }
      else { totalStr = '当前: +' + Math.round(totalVal * 100) + '%'; }
      ctx.fillStyle = '#ffd740'; ctx.font = 'bold 8px "Microsoft YaHei"';
      ctx.fillText(totalStr, tx, ty);
      ty += 12;
    } else {
      ty += 2;
    }

    // Cost
    if (isMax) {
      ctx.fillStyle = '#ffd740'; ctx.font = 'bold 9px "Microsoft YaHei"';
      ctx.fillText('✨ 已满级', tx, ty);
    } else {
      var cost = TECH_CONFIG.costs[curLv];
      var canAfford = gameState.techPoints >= cost;
      ctx.fillStyle = canUp ? (canAfford ? '#ffd740' : '#f44336') : '#555';
      ctx.font = 'bold 9px "Microsoft YaHei"';
      ctx.fillText('升级: ' + cost + '⭐  (点击升级)', tx, ty);
    }
    ty += 13;

    // Prerequisites
    var preKeys = Object.keys(node.pre);
    if (preKeys.length > 0) {
      var preText = '需求: ';
      for (var pi = 0; pi < preKeys.length; pi++) {
        var pk = preKeys[pi];
        var preLv = getTechLevel(brId, pk);
        var preReq = node.pre[pk];
        var preMet = preLv >= preReq;
        preText += pk + ' Lv' + preReq + (preMet ? '✓' : '✗');
        if (pi < preKeys.length - 1) preText += ', ';
      }
      ctx.fillStyle = '#777'; ctx.font = '7px "Microsoft YaHei"';
      ctx.fillText(preText, tx, ty);
    }
  }
}

function render() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // background
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  renderGrid();
  renderRangeIndicator();
  renderTraps();
  renderTowers();
  renderBeams();
  renderEnemies();
  renderGuards();
  renderProjectiles();
  renderSplashFX();
  renderParticles();
  renderFloatingTexts();
  renderTopBar();
  renderSidePanel();
  renderOverlay();
  if (gameState._techPanelOpen) renderTechPanel();
  if (!gameState._techPanelOpen) renderLeftStatsBar();  // hide when tech tree open
}

// ═══════════ 左侧数据栏（始终可见） ═══════════
function renderLeftStatsBar() {
  const sx = 2, sy = MAP_Y, sw = MAP_X - 6, sh = MAP_H;
  // Background
  ctx.fillStyle = 'rgba(22,33,62,0.92)';
  ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, 6); ctx.fill();
  ctx.strokeStyle = '#0f3460'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, 6); ctx.stroke();

  let cy = sy + 8;
  const rowH = 32;
  ctx.textBaseline = 'top';

  const items = [
    ['💰金币', gameState.gold, '#ffd700'],
    ['❤生命', gameState.lives, '#ff5252'],
    ['⭐分数', gameState.score, '#ffab40'],
    ['👾敌人', gameState.enemiesAlive, '#f44336'],
    ['🌊波次', gameState.wave > 50 ? '无尽'+gameState.wave : gameState.wave+'/'+gameState.maxWaves, '#e0e0e0'],
    ['🗼塔数', gameState.towers.length, '#81c784'],
    ['🔬科技', (Number.isInteger(gameState.techPoints) ? gameState.techPoints : gameState.techPoints.toFixed(1)), '#ffd740'],
    ['💥总伤', (gameState._totalDamage >= 1000 ? (gameState._totalDamage/1000).toFixed(1)+'k' : gameState._totalDamage), '#ff1744'],
  ];

  for (const [label, value, color] of items) {
    ctx.fillStyle = '#888'; ctx.font = '9px "Microsoft YaHei"';
    ctx.textAlign = 'left';
    ctx.fillText(label, sx + 6, cy + 2);
    ctx.fillStyle = color; ctx.font = 'bold 14px "Microsoft YaHei"';
    ctx.textAlign = 'right';
    ctx.fillText(String(value), sx + sw - 6, cy + 2);
    cy += rowH;
  }

  // Separator
  cy += 4;
  ctx.strokeStyle = '#0f3460'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(sx + 8, cy); ctx.lineTo(sx + sw - 8, cy); ctx.stroke();
  cy += 8;

  // Save/Load buttons
  const btnW = sw - 16, btnH = 28;
  ctx.fillStyle = '#4caf50';
  ctx.beginPath(); ctx.roundRect(sx + 8, cy, btnW, btnH, 4); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('💾 保存', sx + 8 + btnW/2, cy + btnH/2);
  gameState._leftSaveBtn = {x: sx + 8, y: cy, w: btnW, h: btnH};
  cy += btnH + 4;

  const hasSaved = hasSave();
  ctx.fillStyle = hasSaved ? '#2196f3' : '#555';
  ctx.beginPath(); ctx.roundRect(sx + 8, cy, btnW, btnH, 4); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText('📂 读取', sx + 8 + btnW/2, cy + btnH/2);
  gameState._leftLoadBtn = {x: sx + 8, y: cy, w: btnW, h: btnH};
  cy += btnH + 8;

  // Save detected notification
  if (gameState._saveDetected) {
    var sd = gameState._saveDetected;
    var sdBoxH = 44;
    ctx.fillStyle = 'rgba(33,150,243,0.18)';
    ctx.beginPath(); ctx.roundRect(sx + 6, cy, sw - 12, sdBoxH, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(33,150,243,0.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(sx + 6, cy, sw - 12, sdBoxH, 4); ctx.stroke();
    ctx.fillStyle = '#64b5f6'; ctx.font = 'bold 8px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('📂 检测到存档', sx + sw/2, cy + 4);
    ctx.fillStyle = '#90caf9'; ctx.font = '7px "Microsoft YaHei"';
    ctx.fillText('第' + sd.wave + '波 · ' + sd.timeAgo, sx + sw/2, cy + 18);
    ctx.fillStyle = '#bbdefb'; ctx.font = 'bold 7px "Microsoft YaHei"';
    ctx.fillText('Ctrl+L 读取', sx + sw/2, cy + 30);
    cy += sdBoxH + 6;
  }

  // Speed indicator
  ctx.fillStyle = '#888'; ctx.font = '10px "Microsoft YaHei"'; ctx.textAlign = 'center';
  const spdLabels = {1: '▶ 1x', 2: '⚡ 2x', 3: '⚡ 3x', 4: '🔥 4x'};
  ctx.fillText(spdLabels[gameState.speedMultiplier] || '▶ 1x', sx + sw/2, cy);
  cy += 18;

  // Settings: cycle damage display mode
  const setBtnW = sw - 16, setBtnH = 22;
  const modeLabels = {off: '🔤 伤害:关', single: '🔤 伤害:单个', total: '🔤 伤害:累积'};
  const modeColors = {off: '#555', single: '#ff9800', total: '#4caf50'};
  ctx.fillStyle = modeColors[gameState._dmgDisplayMode] || '#555';
  ctx.beginPath(); ctx.roundRect(sx + 8, cy, setBtnW, setBtnH, 4); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 10px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(modeLabels[gameState._dmgDisplayMode] || '🔤 伤害:单个', sx + 8 + setBtnW/2, cy + setBtnH/2);
  gameState._floatToggleBtn = {x: sx + 8, y: cy, w: setBtnW, h: setBtnH};
}

// ═══════════ 数据面板（按S打开的详细面板） ═══════════
// ═══════════ 初始化 ═══════════
function restartGame() {
  // Apply tech starting bonuses
  const startGold = 300 + getTechBonus('startGold') + getTechBonus('rich');
  const startLives = 20 + getTechBonus('lives');
  gameState.gold = startGold;
  gameState.lives = startLives;
  gameState.score = 0;
  gameState.wave = 0;
  gameState.phase = 'build';
  gameState.speedMultiplier = 1;
  gameState.paused = false;
  gameState.selectedTowerType = null;
  ObjectPool.clear();
  gameState.selectedPlacedTower = null;
  gameState.towers = [];
  gameState.enemies = [];
  gameState.projectiles = [];
  gameState.particles = [];
  gameState.floatingTexts = [];
  gameState.guards = [];
  gameState._traps = [];
  gameState._splashFX = [];
  gameState.waveSpawnQueue = [];
  gameState.wavePreview = null;
  gameState.spawnTimer = 0;
  gameState.enemiesAlive = 0;
  gameState.comboCount = 0;
  gameState.comboTimer = 0;
  gameState._passiveGoldAcc = 0;
  gameState._totalDamage = 0;
  gameState.hintText = '选择塔类型，点击地图放置';
  gameState._upgradeBtns = [];
  gameState._sellBtn = null;
  gameState._restartBtn = null;
  gameState._terrainTypes = [];
  gameState._decorations = [];
  gameState._traps = [];
  gameState._splashFX = [];
  initGrid();
  gameState.techPoints = 0;
  gameState.tech = {A: {}, B: {}, C: {}, combos: {}};
  invalidateTechCache();
  lastTimestamp = 0;
}

function init() {
  buildPaths();
  initGrid();
  // Check for saved game
  if (hasSave()) {
    try {
      const raw = localStorage.getItem('td_save');
      const data = JSON.parse(raw);
      const mins = Math.floor((Date.now() - data.timestamp) / 60000);
      const timeAgo = mins < 1 ? '刚刚' : mins < 60 ? mins + '分钟前' : Math.floor(mins/60) + '小时前';
      gameState._saveDetected = {wave: data.wave, timeAgo: timeAgo};
    } catch(e) {}
  }
  lastTimestamp = 0;
  requestAnimationFrame(gameLoop);
}

// polyfill roundRect if not available
if (!ctx.roundRect) {
  ctx.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = {tl: r, tr: r, br: r, bl: r};
    ctx.beginPath();
    ctx.moveTo(x + r.tl, y);
    ctx.lineTo(x + w - r.tr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
    ctx.lineTo(x + w, y + h - r.br);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
    ctx.lineTo(x + r.bl, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
    ctx.lineTo(x, y + r.tl);
    ctx.quadraticCurveTo(x, y, x + r.tl, y);
    ctx.closePath();
  };
}

window.addEventListener('resize', () => {
  // Canvas CSS auto-scales, no need to resize internal buffer
  // Internal resolution stays CANVAS_W x CANVAS_H
});
init();
</script>
