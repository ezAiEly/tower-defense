  if (getTechBonus('firstHalf') > 0 && !gameState._firstTowerPlacedThisWave) {
    actualCost = Math.floor(actualCost * 0.5);
    gameState._firstTowerPlacedThisWave = true;
  }
  if (gameState.gold < actualCost) return false;
  if (gameState.grid[row][col] !== 0) return false; // only empty grass cells // allow towers on paths for mazing

  gameState.gold -= actualCost;
  gameState.grid[row][col] = 10; // tower marker (10+)
  const lvlData = cfg.levels[0];
  const tpos = gridToPixel(col, row);
  gameState.towers.push({
    col, row, type, _lvlIdx: 0,
    _px: tpos.x, _py: tpos.y,

    pierceCount: lvlData.pierceCount || 0,

    hp: cfg.cost * 2,
    curseAmount: 0,
    curseTimer: 0,
    asleep: false,
    asleepTimer: 0,
  });
  // Apply tech bonuses
  const newTower = gameState.towers[gameState.towers.length - 1];
  if (newTower) refreshTowerTechStats(newTower);
  gameState.selectedTowerType = null;
  gameState.hintText = `${cfg.name}已放置，点击塔可查看详情`;

function upgradeTower(tower, branchIdx) {
  const cfg = TOWER_CONFIG[tower.type];
  const curIdx = tower._lvlIdx || 0;
  if (curIdx >= 7) return false; // already max level (L4)
  let nextIdx;
  if (curIdx === 0) {
    nextIdx = branchIdx === 0 ? 1 : 2;
  } else if (curIdx >= 3 && curIdx <= 6) {
    nextIdx = curIdx + 4; // L3→L4 direct ultimate upgrade
  } else {
    const pair = (cfg.level3Branches || [[3,4],[5,6]])[curIdx - 1];
    nextIdx = pair ? pair[branchIdx] : -1;
  }
  if (nextIdx == null || nextIdx < 0 || nextIdx >= cfg.levels.length) return false;
  const nextLvl = cfg.levels[nextIdx];
  if (!nextLvl) return false;
  let actualCost = nextLvl.upgradeCost || Math.floor(cfg.cost * 1.8);
  // Tech discount
  const discount = getTechBonus('discount');
  actualCost = Math.floor(actualCost * (1 - discount));
  // Free upgrade chance
  if (getTechBonus('freeUp') > 0 && Math.random() < getTechBonus('freeUp')) {
    actualCost = 0;
    spawnFloatingText(gridToPixel(tower.col,tower.row).x, gridToPixel(tower.col,tower.row).y - 8, '🆓免费!', '#ffd740');
  }
  if (gameState.gold < actualCost) return false;

  gameState.gold -= actualCost;
  tower.totalInvested += actualCost;
  tower._lvlIdx = nextIdx;
  const upos = gridToPixel(tower.col, tower.row);
  tower._px = upos.x;
  tower._py = upos.y;
  tower.damage = nextLvl.damage;
  tower.range = nextLvl.range;
  tower.attackCooldown = nextLvl.cooldown;
  tower.splashRadius = cfg.splashRadius || nextLvl.splashRadius || 0;
  tower.slowAmount = nextLvl.slowAmount || 0;
  tower.slowDuration = nextLvl.slowDuration || 0;
  tower.chainCount = nextLvl.chainCount || 0;
  tower.chainRange = nextLvl.chainRange || 0;
  tower.dotDamage = nextLvl.dotDamage || 0;
  tower.dotDuration = nextLvl.dotDuration || 0;
  tower.maxStacks = nextLvl.maxStacks || 0;
  tower.guardCount = nextLvl.guardCount || 0;
  tower.guardHp = nextLvl.guardHp || 0;
  tower.guardLifespan = nextLvl.guardLifespan || 0;
  tower.guardHealAura = nextLvl.guardHealAura || false;
  tower.guardHealAmount = nextLvl.guardHealAmount || 0;
  tower.guardSpeedMult = nextLvl.guardSpeedMult || 1.0;
  tower.splashDmgMult = nextLvl.splashDmgMult || 1.0;
  tower.chainNoDecay = nextLvl.chainNoDecay || false;
  tower.shieldBypass = nextLvl.shieldBypass || false;
  tower.ignoreResist = nextLvl.ignoreResist || false;
  tower.armorPen = nextLvl.armorPen || 0;
  tower.multiShot = nextLvl.multiShot || 0;
  tower.critChance = nextLvl.critChance || 0;
  tower.critMult = nextLvl.critMult || 2.0;
  tower.pierceCount = nextLvl.pierceCount || 0;
  tower.executeThreshold = nextLvl.executeThreshold || 0;
  tower.goldBonus = nextLvl.goldBonus || 0;
  tower.fearChance = nextLvl.fearChance || 0;
  tower.fearDuration = nextLvl.fearDuration || 0;
  tower.knockback = nextLvl.knockback || 0;
  tower.lifesteal = nextLvl.lifesteal || 0;
  tower.stackingDebuff = nextLvl.stackingDebuff || 0;
  tower.rampUpDmg = nextLvl.rampUpDmg || 0;
  tower.shatterChance = nextLvl.shatterChance || 0;
  tower.ricochet = nextLvl.ricochet || 0;
  tower.guardTaunt = nextLvl.guardTaunt || false;
  tower.guardShield = nextLvl.guardShield || 0;
  tower.guardCounter = nextLvl.guardCounter || false;
  tower.guardRallyDmg = nextLvl.guardRallyDmg || 0;
  tower.auraHeal = nextLvl.auraHeal || 0;
  tower.auraGoldGen = nextLvl.auraGoldGen || 0;
  tower.auraReflect = nextLvl.auraReflect || 0;
  tower.maxHp = Math.floor(tower.maxHp * (nextIdx >= 7 ? 2.2 : 1.6));
  tower.hp = tower.maxHp;
  refreshTowerTechStats(tower); // Apply tech bonuses after upgrade
  gameState.hintText = `${cfg.name} → ${nextLvl.name}`;
  AudioFX.upgrade();
  return true;
}

function sellTower(tower) {
  const sellRate = 0.5 + getTechBonus('sellVal');
  const refund = Math.floor(tower.totalInvested * sellRate);
  gameState.gold += refund;
  gameState.grid[tower.row][tower.col] = 0;
  // kill all guards belonging to this tower
  for (const g of gameState.guards) {
    if (g.tower === tower) g.alive = false;
  }
  const idx = gameState.towers.indexOf(tower);
  if (idx >= 0) gameState.towers.splice(idx, 1);
  gameState.selectedPlacedTower = null;
  gameState.hintText = `出售塔获得 ${refund} 金币`;
  AudioFX.sell();
}

// ═══════════ 存档系统 ═══════════
function saveGame() {
  const data = saveState();
  data.version = 1;
  data.timestamp = Date.now();
  try {
    localStorage.setItem('td_save', JSON.stringify(data));
    gameState.hintText = '💾 游戏已保存！';
    return true;
  } catch(e) {
    gameState.hintText = '❌ 保存失败';
    return false;
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem('td_save');
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || data.version !== 1) return false;
    if (loadState(data)) {
      gameState.hintText = '📂 游戏已读取！共' + (data.towers ? data.towers.length : 0) + '座塔';
      return true;
    }
    return false;
  } catch(e) {
    console.error('Load failed:', e);
    return false;
  }
}

function clearSave() {
  localStorage.removeItem('td_save');
  gameState.hintText = '🗑 存档已删除';
}

function hasSave() {
  return !!localStorage.getItem('td_save');
}

// Pure state snapshot (no localStorage dependency)
function saveState() {
  return {
    gold: gameState.gold,
    lives: gameState.lives,
    score: gameState.score,
    wave: gameState.wave,
    phase: gameState.phase === 'combat' ? 'build' : gameState.phase,
    speedMultiplier: gameState.speedMultiplier,
    towers: gameState.towers.map(t => ({
      type: t.type, col: t.col, row: t.row,
      _lvlIdx: t._lvlIdx, totalInvested: t.totalInvested, kills: t.kills || 0,
    })),
    techPoints: gameState.techPoints,
    tech: JSON.parse(JSON.stringify(gameState.tech)),
  };
}

function loadState(state) {
  if (!state || state.wave == null) return false;
  gameState.gold = state.gold;
  gameState.lives = state.lives;
  gameState.score = state.score;
  gameState.wave = state.wave;
  gameState.phase = state.phase;
  gameState.speedMultiplier = state.speedMultiplier || 1;
  // Clear combat & rebuild
  ObjectPool.clear();
  gameState.enemies = []; gameState.projectiles = []; gameState.particles = [];
  gameState.floatingTexts = []; gameState.guards = []; gameState._traps = [];
  gameState.waveSpawnQueue = []; gameState.wavePreview = null;
  gameState.spawnTimer = 0; gameState.enemiesAlive = 0;
  gameState.comboCount = 0; gameState.comboTimer = 0; gameState._passiveGoldAcc = 0;
  gameState.selectedTowerType = null; gameState.selectedPlacedTower = null;
  gameState.paused = false;
  // Clear tower grid
  for (let row = 0; row < GRID_ROWS; row++)
    for (let col = 0; col < GRID_COLS; col++)
      if (gameState.grid[row][col] >= 10) gameState.grid[row][col] = 0;
  // Rebuild towers from state
  gameState.towers = [];
  for (const td of (state.towers || [])) {
    const cfg = TOWER_CONFIG[td.type];
    if (!cfg) continue;
    const lvlData = cfg.levels[td._lvlIdx || 0];
    const pos = gridToPixel(td.col, td.row);
    gameState.grid[td.row][td.col] = 10;
    gameState.towers.push({
      col: td.col, row: td.row, type: td.type, _lvlIdx: td._lvlIdx || 0,
      _px: pos.x, _py: pos.y,
      damage: lvlData.damage, range: lvlData.range, attackCooldown: lvlData.cooldown, cooldownRemaining: 0,
      splashRadius: cfg.splashRadius || lvlData.splashRadius || 0,
      slowAmount: lvlData.slowAmount || 0, slowDuration: lvlData.slowDuration || 0,
      chainCount: lvlData.chainCount || 0, chainRange: lvlData.chainRange || 0,
      dotDamage: lvlData.dotDamage || 0, dotDuration: lvlData.dotDuration || 0, maxStacks: lvlData.maxStacks || 0,
      guardCount: lvlData.guardCount || 0, guardHp: lvlData.guardHp || 0, guardLifespan: lvlData.guardLifespan || 0,
      guardHealAura: lvlData.guardHealAura || false, guardHealAmount: lvlData.guardHealAmount || 0,
      guardSpeedMult: lvlData.guardSpeedMult || 1.0, splashDmgMult: lvlData.splashDmgMult || 1.0,
      chainNoDecay: lvlData.chainNoDecay || false, shieldBypass: lvlData.shieldBypass || false,
      ignoreResist: lvlData.ignoreResist || false, target: null, angle: 0,
      totalInvested: td.totalInvested || cfg.cost, kills: td.kills || 0,
      armorPen: lvlData.armorPen || 0, multiShot: lvlData.multiShot || 0,
      critChance: lvlData.critChance || 0, critMult: lvlData.critMult || 2.0,
      pierceCount: lvlData.pierceCount || 0, executeThreshold: lvlData.executeThreshold || 0,
      goldBonus: lvlData.goldBonus || 0, fearChance: lvlData.fearChance || 0,
      fearDuration: lvlData.fearDuration || 0, knockback: lvlData.knockback || 0,
      lifesteal: lvlData.lifesteal || 0, stackingDebuff: lvlData.stackingDebuff || 0,
      rampUpDmg: lvlData.rampUpDmg || 0, shatterChance: lvlData.shatterChance || 0,
      ricochet: lvlData.ricochet || 0, guardTaunt: lvlData.guardTaunt || false,
      guardShield: lvlData.guardShield || 0, guardCounter: lvlData.guardCounter || false,
      guardRallyDmg: lvlData.guardRallyDmg || 0, auraHeal: lvlData.auraHeal || 0,
      auraGoldGen: lvlData.auraGoldGen || 0, auraReflect: lvlData.auraReflect || 0,
      disabled: false, disabledTimer: 0,

  }

  if (state.techPoints != null) gameState.techPoints = state.techPoints;

  invalidateTechCache();
  gameState._saveDetected = null; // save consumed, clear notification
  // Apply tech bonuses to restored towers
  refreshAllTowerTech();
  lastTimestamp = 0;
  return true;
}

function damageTower(tower, amount) {
  if (!tower) return;
  // Reflect aura: reflect portion of damage to all nearby enemies
  if (tower._reflectBuff > 0) {
    const rflDmg = Math.floor(amount * tower._reflectBuff);
    if (rflDmg > 0) {
      const tpos = gridToPixel(tower.col, tower.row);
      const rflRangeSq = (tower.range * CELL_SIZE * 1.5) * (tower.range * CELL_SIZE * 1.5);
      for (const enemy of gameState.enemies) {
        if (!enemy.alive) continue;
        if (distSq(tpos, enemy) <= rflRangeSq) {
          enemy.hp -= rflDmg;
          spawnFloatingText(enemy.x, enemy.y - enemy.size, '↩' + rflDmg, '#ffd740', true);
        }
      }
    }
  }
  // Tech defense modifiers
  let finalDmg = amount;
  // Curse resistance
  if (tower._curseResist > 0 && tower.curseAmount > 0) {
    tower.curseAmount *= (1 - tower._curseResist);
  }
  // Armor/damage reduction
  if (tower._techArmor > 0) {
    finalDmg = Math.floor(finalDmg * (1 - tower._techArmor));
  }
  const dmgRes = getTechBonus('dmgRes');
  if (dmgRes > 0) {
    finalDmg = Math.floor(finalDmg * (1 - dmgRes));
  }
  // Immortal: max 50% HP per hit
  if (getTechBonus('immortal') > 0) {
    finalDmg = Math.min(finalDmg, Math.floor(tower.maxHp * 0.5));
  }
  // Thorn damage: deal damage back to attacker based on tower HP
  const thornDmg = getTechBonus('thornDmg');
  if (thornDmg > 0) {
    const thornAmount = Math.floor(tower.maxHp * thornDmg);
    const tpos = gridToPixel(tower.col, tower.row);
    const splash = getTechBonus('thornSplash') > 0 ? CELL_SIZE * 2 : 0;
    for (const enemy of gameState.enemies) {
      if (!enemy.alive) continue;
      if (dist(tpos, enemy) <= tower.range * CELL_SIZE * 1.5) {
        enemy.hp -= thornAmount;
        spawnFloatingText(enemy.x, enemy.y - enemy.size, '🌿' + thornAmount, '#ff9800', true);
        if (splash > 0) {
          // Splash nearby enemies too
          for (const e2 of gameState.enemies) {
            if (!e2.alive || e2 === enemy) continue;
            if (dist(enemy, e2) <= splash) {
              e2.hp -= Math.floor(thornAmount * 0.5);
            }
          }
        }
      }
    }
  }
  tower.hp -= finalDmg;
  if (tower.hp <= 0) {
    tower.hp = 0;
    gameState.grid[tower.row][tower.col] = 0;
    const idx = gameState.towers.indexOf(tower);
    if (idx >= 0) gameState.towers.splice(idx, 1);
    // kill guards
    for (const g of gameState.guards) {
      if (g.tower === tower) g.alive = false;
    }
    if (gameState.selectedPlacedTower === tower) gameState.selectedPlacedTower = null;
    spawnDeathParticles(gridToPixel(tower.col, tower.row).x, gridToPixel(tower.col, tower.row).y, '#f44336');
    spawnFloatingText(gridToPixel(tower.col, tower.row).x, gridToPixel(tower.col, tower.row).y - 10, '摧毁!', '#f44336');
  }
}

function findTarget(tower) {
  const pos = {x: tower._px || 0, y: tower._py || 0};
  if (!pos.x) { const p = gridToPixel(tower.col, tower.row); pos.x = p.x; pos.y = p.y; tower._px = p.x; tower._py = p.y; }
  const rangePx = (tower.range + (tower.buffRngAdd || 0)) * CELL_SIZE;
  const rangeSq = rangePx * rangePx;
  let bestEnemy = null;
  let bestProgress = -1;

  const lvlCfg = getTowerLevelConfig(tower);
  const bossFirst = lvlCfg.bossPriority || false;

  const nearby = getNearbyEnemies(pos.x, pos.y, rangePx);
  for (const enemy of nearby) {
    if (!enemy.alive) continue;
    if (enemy._burrowed) continue;
    if (enemy.flying && tower.type !== 'arrow' && tower.type !== 'ice' && tower.type !== 'lightning' && tower.type !== 'sniper' && tower.damageType !== 'magic') continue;
    const dSq = distSq(pos, enemy);
    if (dSq > rangeSq) continue;
    if (enemy.stealthRange && dSq > (enemy.stealthRange * CELL_SIZE) * (enemy.stealthRange * CELL_SIZE)) continue;
    // Boss priority: bosses are always chosen over non-bosses
    const isBoss = enemy.type === 'boss' || enemy.maxHp >= 500;
    const bestIsBoss = bestEnemy && (bestEnemy.type === 'boss' || bestEnemy.maxHp >= 500);
    let better = false;
    if (bossFirst) {
      if (isBoss && !bestIsBoss) better = true;
      else if (!isBoss && bestIsBoss) better = false;
      else if (enemy.pathProgress > bestProgress) better = true;
    } else {
      if (enemy.pathProgress > bestProgress) better = true;
    }
    if (better) {
      bestProgress = enemy.pathProgress;
      bestEnemy = enemy;
    }
  }
  return bestEnemy;
}

// ═══════════ 敌人逻辑 ═══════════
function getWeightedRandomPathIdx() {
  const weights = gameState.paths.map(function(p) { return p.pixels.length; });
  const total = weights.reduce(function(a, b) { return a + b; }, 0);
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return weights.length - 1;
}

function createEnemy(config) {
  const cfg = ENEMY_CONFIG[config.type];
  const hp = getEnemyHp(config.type, gameState.wave);
  const pathIdx = (config.pathIdx !== undefined) ? config.pathIdx : getWeightedRandomPathIdx();
  const path = gameState.paths[pathIdx];
  const startPx = path.pixels[0];

  gameState.enemies.push({
    type: config.type,
    hp: hp,
    maxHp: hp,
    speed: cfg.speed,
    currentSpeed: cfg.speed,
    pathIndex: pathIdx,
    pathProgress: 0,
    reward: cfg.reward,
    alive: true,
    slowTimer: 0,
    slowAmount: 0,
    size: cfg.size,
    shield: cfg.shield || 0,
    physResist: cfg.physResist || 0,

    speedAuraRange: cfg.speedAuraRange || 0,

    healAura: cfg.healAura || 0,

    _healAuraTimer: 0,

    _defBroken: false,

    x: startPx.x,
    y: startPx.y,
  });
  gameState.enemiesAlive++;
  // Assign behavior strategies
  assignBehaviors(gameState.enemies[gameState.enemies.length - 1]);
}

// Spatial hash: map enemies to grid cells for fast range queries
const SPATIAL_CELL = 3; // cell size in grid cells (~108px = 3*36)

function updateSpatialGrid() {
  gameState._spatialGrid = {};
  for (const enemy of gameState.enemies) {
    if (!enemy.alive || enemy._burrowed) continue;
    const cx = Math.floor((enemy.x - MAP_X) / (CELL_SIZE * SPATIAL_CELL));
    const cy = Math.floor((enemy.y - MAP_Y) / (CELL_SIZE * SPATIAL_CELL));
    const key = cx + '_' + cy;
    if (!gameState._spatialGrid[key]) gameState._spatialGrid[key] = [];
    gameState._spatialGrid[key].push(enemy);
  }
}

let _visitToken = 0;
function getNearbyEnemies(px, py, rangePx) {
  _visitToken++;
  const cells = Math.ceil(rangePx / (CELL_SIZE * SPATIAL_CELL)) + 1;
  const cx = Math.floor((px - MAP_X) / (CELL_SIZE * SPATIAL_CELL));
  const cy = Math.floor((py - MAP_Y) / (CELL_SIZE * SPATIAL_CELL));
  const result = [];
  const rSq = (rangePx + CELL_SIZE * 1.5) * (rangePx + CELL_SIZE * 1.5);
  for (let dx = -cells; dx <= cells; dx++) {
    for (let dy = -cells; dy <= cells; dy++) {
      const key = (cx + dx) + '_' + (cy + dy);
      const cell = gameState._spatialGrid[key];
      if (!cell) continue;
      for (const enemy of cell) {
        if (enemy._visitToken === _visitToken) continue;
        enemy._visitToken = _visitToken;
        if (distSq({x: px, y: py}, enemy) <= rSq) {
          result.push(enemy);
        }
      }
    }
  }
  return result;
}


// ═══════════ 敌人行为系统 (策略模式) ═══════════
const ENEMY_BEHAVIORS = {
  healer: {
    update(dt, enemy) {
      const hcfg = ENEMY_CONFIG.healer;
      if (!enemy._healTimer) enemy._healTimer = hcfg.healInterval;
      enemy._healTimer -= dt;
      if (enemy._healTimer <= 0) {
        enemy._healTimer = hcfg.healInterval;
        const healPx = hcfg.healRange * CELL_SIZE;
        for (const other of gameState.enemies) {
          if (!other.alive || other === enemy) continue;
          if (distSq(enemy, other) <= healPx * healPx) {
            other.hp = Math.min(other.maxHp, other.hp + hcfg.healAmount);
            spawnFloatingText(other.x, other.y - other.size, '+' + hcfg.healAmount, '#81c784');
          }
        }
      }
    }
  },
  regen: {
    update(dt, enemy) {
      if (!enemy.alive || enemy.regenRate <= 0) return;
      enemy._regenTimer -= dt;
      if (enemy._regenTimer <= 0) {
        enemy._regenTimer = enemy.regenInterval;
        enemy.hp = Math.min(enemy.maxHp, enemy.hp + enemy.regenRate);
        if (enemy.hp < enemy.maxHp) {
          spawnFloatingText(enemy.x, enemy.y - enemy.size, '+' + enemy.regenRate, '#66bb6a');
        }
      }
    }
  },
  berserker: {
    update(dt, enemy) {
      if (!enemy.berserk || enemy._berserked || enemy.hp >= enemy.maxHp * 0.5) return;
      enemy._berserked = true;
      enemy.currentSpeed = enemy.speed * 1.8;
      enemy.physResist = (enemy.physResist || 0) + 0.15;
      spawnFloatingText(enemy.x, enemy.y - enemy.size, '暴怒!', '#ff1744');
    }
  },
  summoner: {
    update(dt, enemy) {
      if (!enemy.summonType) return;
      enemy._summonTimer -= dt;
      if (enemy._summonTimer <= 0) {
        enemy._summonTimer = enemy.summonInterval;
        for (let s = 0; s < enemy.summonCount; s++) {
          createEnemy({ type: enemy.summonType, pathIdx: enemy.pathIndex });
        }
        spawnFloatingText(enemy.x, enemy.y - enemy.size, '召唤!', '#ff7043');
      }
    }
  },
  saboteur: {
    update(dt, enemy) {
      if (enemy.sabotageRange <= 0) return;
      if (!enemy._sabotageReady) {
        enemy._sabotageTimer -= dt;
        if (enemy._sabotageTimer <= 0) enemy._sabotageReady = true;
        return;
      }
      const sabPx = enemy.sabotageRange * CELL_SIZE;
      for (const tower of gameState.towers) {
        if (tower.disabled) continue;
        const tpos = gridToPixel(tower.col, tower.row);
        if (distSq(enemy, tpos) <= sabPx * sabPx) {
          tower.disabled = true;
          tower.disabledTimer = enemy.sabotageDuration;
          enemy._sabotageReady = false;
          enemy._sabotageTimer = enemy.sabotageCd;
          spawnFloatingText(tpos.x, tpos.y - 12, '⚡禁用!', '#ff5722');
          spawnHitParticles(tpos.x, tpos.y, '#ff5722');
          break;
        }
      }
    }
  },
  burrow: {
    update(dt, enemy) {
      if (!enemy.burrow) return;
      enemy._burrowTimer -= dt;
      if (enemy._burrowed) {
        if (enemy._burrowTimer <= 0) {
          enemy._burrowed = false;
          enemy._burrowTimer = enemy.burrowCd;
        }
      } else {
        if (enemy._burrowTimer <= 0) {
          enemy._burrowed = true;
          enemy._burrowTimer = enemy.burrowDuration;
        }
      }
    }
  },
  landForm: {
    update(dt, enemy) {
      if (!enemy.landForm || enemy._landed || enemy.pathProgress <= 5) return;
      enemy._landTimer += dt;
      if (enemy._landTimer > 3.0) {
        enemy._landed = true;
        enemy.currentSpeed = enemy.speed * 0.3;
        enemy.physResist = (enemy.physResist || 0) + 0.5;
        spawnFloatingText(enemy.x, enemy.y - enemy.size, '着陆!', '#78909c');
      }
    }
  },
  rangedAttack: {
    update(dt, enemy) {
      if (enemy.rangedDmg <= 0) return;
      enemy._rangedTimer -= dt;
      if (enemy._rangedTimer > 0) return;
      const rngPx = enemy.rangedRange * CELL_SIZE;
      let nearestTower = null, nearestDist = rngPx;
      for (const t of gameState.towers) {
        const d = dist(enemy, gridToPixel(t.col, t.row));
        if (d < nearestDist) { nearestDist = d; nearestTower = t; }
      }
      if (nearestTower) {
        damageTower(nearestTower, enemy.rangedDmg);
        spawnFloatingText(nearestTower.col * CELL_SIZE + MAP_X + CELL_SIZE/2, nearestTower.row * CELL_SIZE + MAP_Y, '-' + enemy.rangedDmg, '#ff5252');
        const ep = ObjectPool.acquire('particle') || {};
        Object.assign(ep, {x:enemy.x, y:enemy.y, vx:0, vy:0, life:0.3, maxLife:0.3, color:'#ff5252', size:3, alive:true});
        gameState.particles.push(ep);
      }
      enemy._rangedTimer = enemy.rangedCd;
      enemy.currentSpeed = enemy.speed * 0.5;
      enemy._rangedSlowTimer = 0.3;
    }
  },
  curseAura: {
    update(dt, enemy) {
      if (enemy.curseRange <= 0) return;
      const cursePx = enemy.curseRange * CELL_SIZE;
      for (const t of gameState.towers) {
        const d = dist(enemy, gridToPixel(t.col, t.row));
        if (d <= cursePx) {
          t.curseAmount = Math.max(t.curseAmount || 0, enemy.curseAmount);
          t.curseTimer = 1.5;
        }
      }
    }
  },
  speedAura: {
    update(dt, enemy) {
      if (enemy.speedAura <= 0) return;
      const auraPx = enemy.speedAuraRange * CELL_SIZE;
      for (const other of gameState.enemies) {
        if (!other.alive || other === enemy) continue;
        if (distSq(enemy, other) <= auraPx * auraPx) {
          other.currentSpeed = Math.max(other.currentSpeed, other.speed * (1 + enemy.speedAura));
        }
      }
    }
  },
  healAura: {
    update(dt, enemy) {
      if (enemy.healAura <= 0) return;
      enemy._healAuraTimer -= dt;
      if (enemy._healAuraTimer <= 0) {
        enemy._healAuraTimer = 2.0;
        const hAuraPx = enemy.healAuraRange * CELL_SIZE;
        for (const other of gameState.enemies) {
          if (!other.alive || other === enemy) continue;
          if (!other.shield && other.maxHp < 80) continue;
          if (distSq(enemy, other) <= hAuraPx * hAuraPx) {
            other.hp = Math.min(other.maxHp, other.hp + enemy.healAura);
          }
        }
      }
    }
  },
  trail: {
    update(dt, enemy) {
      if (!enemy.trailType || enemy._burrowed) return;
      enemy._trailTimer -= dt;
      if (enemy._trailTimer <= 0) {
        enemy._trailTimer = 0.5;
        for (const t of gameState.towers) {
          const d = dist(enemy, gridToPixel(t.col, t.row));
          if (d < CELL_SIZE * 1.2) damageTower(t, enemy.trailDamage * dt);
        }
      }
    }
  },
  stationary: {
    update(dt, enemy) {
      if (enemy.stationary) enemy.currentSpeed = 0;
    }
  },
  dot: {
    update(dt, enemy) {
      if (!enemy.dotStacks || enemy.dotStacks.length === 0) return;
      for (let ds = enemy.dotStacks.length - 1; ds >= 0; ds--) {
        const stack = enemy.dotStacks[ds];
        stack.timer -= dt;
        enemy.hp -= (stack.damage / stack.maxTimer) * dt;
        if (stack.timer <= 0) enemy.dotStacks.splice(ds, 1);
      }
      if (enemy.hp <= 0 && enemy.alive) killEnemy(enemy, null);
    }
  },
};

// Assign behaviors to enemy at creation
function assignBehaviors(enemy) {
  enemy._behaviors = [];
  if (enemy.type === 'healer') enemy._behaviors.push(ENEMY_BEHAVIORS.healer);
  if (enemy.regenRate > 0) enemy._behaviors.push(ENEMY_BEHAVIORS.regen);
  if (enemy.berserk) enemy._behaviors.push(ENEMY_BEHAVIORS.berserker);
  if (enemy.summonType) enemy._behaviors.push(ENEMY_BEHAVIORS.summoner);
  if (enemy.sabotageRange > 0) enemy._behaviors.push(ENEMY_BEHAVIORS.saboteur);
  if (enemy.burrow) enemy._behaviors.push(ENEMY_BEHAVIORS.burrow);
  if (enemy.landForm) enemy._behaviors.push(ENEMY_BEHAVIORS.landForm);
  if (enemy.rangedDmg > 0) enemy._behaviors.push(ENEMY_BEHAVIORS.rangedAttack);
  if (enemy.curseRange > 0) enemy._behaviors.push(ENEMY_BEHAVIORS.curseAura);
  if (enemy.speedAura > 0) enemy._behaviors.push(ENEMY_BEHAVIORS.speedAura);
  if (enemy.healAura > 0) enemy._behaviors.push(ENEMY_BEHAVIORS.healAura);
  if (enemy.trailType) enemy._behaviors.push(ENEMY_BEHAVIORS.trail);
  if (enemy.stationary) enemy._behaviors.push(ENEMY_BEHAVIORS.stationary);
  enemy._behaviors.push(ENEMY_BEHAVIORS.dot); // all enemies can have DoT
}

function updateEnemies(dt) {
  for (const enemy of gameState.enemies) {
    if (!enemy.alive) continue;

    // Accumulated damage display timer
    if (enemy._dmgTimer > 0) {
      enemy._dmgTimer -= dt;
      if (enemy._dmgTimer <= 0) enemy._dmgAccum = 0;
    }

    // slow effect
    if (enemy.slowTimer > 0) {
      enemy.slowTimer -= dt;
      enemy.currentSpeed = enemy.speed * (1 - enemy.slowAmount);
      if (enemy.slowTimer <= 0) {
        enemy.currentSpeed = enemy.speed;
        enemy.slowAmount = 0;
      }
    }

    // Execute enemy behaviors (strategy pattern)
    if (enemy._behaviors) {
      for (const behavior of enemy._behaviors) {
        behavior.update(dt, enemy);
      }
    }
    // Stationary enemies skip movement
    if (enemy.stationary) continue;

    // Ranged attack slow recovery (dt-based)
    if (enemy._rangedSlowTimer > 0) {
      enemy._rangedSlowTimer -= dt;
      if (enemy._rangedSlowTimer <= 0) {
        if (enemy.alive && !enemy.slowTimer) enemy.currentSpeed = enemy.speed;
      }
    }
    if (enemy._rangedSlowTimer > 0) { enemy._rangedSlowTimer -= dt; if (enemy._rangedSlowTimer <= 0) { if (enemy.alive && !enemy.slowTimer) enemy.currentSpeed = enemy.speed; } }
    // Stun handling
    if (enemy.stunned && enemy.stunTimer > 0) {
      enemy.stunTimer -= dt;
      if (enemy.stunTimer <= 0) {
        enemy.stunned = false;
        enemy.currentSpeed = enemy._storedSpeed || enemy.speed;
      }
    }

    // Confusion handling
    if (enemy.confused && enemy.confuseTimer > 0) {
      enemy.confuseTimer -= dt;
      if (enemy.confuseTimer <= 0) enemy.confused = false;
    }
    // Fear handling
    if (enemy._feared && enemy._fearTimer > 0) {
      enemy._fearTimer -= dt;
      if (enemy._fearTimer <= 0) enemy._feared = false;
    }

    // Defense break timer
    if (enemy._defBroken && enemy._defBreakTimer > 0) {
      enemy._defBreakTimer -= dt;
      if (enemy._defBreakTimer <= 0) enemy._defBroken = false;
    }

    // move along assigned path
    const path = gameState.paths[enemy.pathIndex || 0];
    // Slow when passing through a cell occupied by a tower (mazing mechanic)
    const ec = pixelToGrid(enemy.x, enemy.y);
    let towerSlow = 1;
    if (ec && gameState.grid[ec.row][ec.col] >= 10) towerSlow = 0.5;
    let speedCellsPerSec = enemy.currentSpeed / CELL_SIZE * towerSlow;
    if (enemy.confused) speedCellsPerSec *= -1;
    if (enemy._feared) speedCellsPerSec = -Math.abs(speedCellsPerSec) * 1.5;
    // Guard physical block: completely stopped
    if (enemy._blockedByGuard) {
      speedCellsPerSec = 0;
      enemy._blockedByGuard = false; // reset each frame, guards reapply
    }
    if (!enemy.stunned) {
      enemy.pathProgress += speedCellsPerSec * dt;
    }

    const maxProgress = path.pixels.length - 1;
    if (enemy.pathProgress >= maxProgress) {
      // reached exit
      enemy.alive = false;
      enemy.x = path.pixels[maxProgress].x;
      enemy.y = path.pixels[maxProgress].y;
      let lifeCost = enemy.type === 'boss' ? 5 : enemy.type === 'tank' ? 3 : 1;
      if (enemy.type === 'goblin') lifeCost = 0; // goblin doesn't cost lives
      gameState.lives -= lifeCost;
      // Gold steal
      if (enemy.stealGold > 0) {
        const stolen = Math.min(gameState.gold, enemy.stealGold);
        gameState.gold -= stolen;
        spawnFloatingText(enemy.x, enemy.y - enemy.size, '-' + stolen + '金', '#ff5252');
      }
      gameState.enemiesAlive--;
      spawnDeathParticles(enemy.x, enemy.y, ENEMY_CONFIG[enemy.type].color);
      continue;
    }

    // interpolate position
    const idx = Math.floor(enemy.pathProgress);
    const frac = enemy.pathProgress - idx;
    const p0 = path.pixels[idx];
    const p1 = path.pixels[Math.min(idx + 1, maxProgress)];
    enemy.x = lerp(p0.x, p1.x, frac);
    enemy.y = lerp(p0.y, p1.y, frac);
  }
}

// ═══════════ 投射物逻辑 ═══════════
function spawnProjectile(tower, target) {
  const pos = gridToPixel(tower.col, tower.row);
  const cfg = TOWER_CONFIG[tower.type];
  const lvl = getTowerLevelConfig(tower);
  let baseDmg = tower.curseAmount > 0 ? Math.floor(tower.damage * (1 - tower.curseAmount)) : tower.damage;
  baseDmg = Math.floor(baseDmg * (tower.buffDmgMul || 1.0));

  // Compute bezier arc path for arcing towers with movement prediction
  let arcPath = null;
  let arcProgress = 0;
  const arcH = cfg.arcHeight || 0;
  if (arcH > 0 && cfg.projectileSpeed > 0) {
    const steps = 16;
    arcPath = [];
    const sx = pos.x, sy = pos.y;
    // Predict enemy movement for arcing projectiles (imperfect lead)
    let ex = target.x, ey = target.y;
    const d = dist(pos, target);
    const travelTime = d / cfg.projectileSpeed;
    if (travelTime > 0.05 && target.currentSpeed > 0) {
      const path = gameState.paths[target.pathIndex || 0];
      const predictedProgress = target.pathProgress + (target.currentSpeed / CELL_SIZE) * travelTime;
      const clampedProgress = Math.min(predictedProgress, path.pixels.length - 1);
      const idx = Math.floor(clampedProgress);
      const frac = clampedProgress - idx;
      const p0 = path.pixels[idx];
      const p1 = path.pixels[Math.min(idx + 1, path.pixels.length - 1)];
      // Add ~20% prediction error (imperfect aim)
      const errX = (Math.random() - 0.5) * d * 0.15;
      const errY = (Math.random() - 0.5) * d * 0.15;
      ex = p0.x + (p1.x - p0.x) * frac + errX;
      ey = p0.y + (p1.y - p0.y) * frac + errY;
    }
    const mx = (sx + ex) / 2;
    const my = Math.min(sy, ey) - arcH;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const x = (1-t)*(1-t)*sx + 2*(1-t)*t*mx + t*t*ex;
      const y = (1-t)*(1-t)*sy + 2*(1-t)*t*my + t*t*ey;
      arcPath.push({x, y});
    }
  }

  AudioFX.shoot(tower.type);

  let proj = ObjectPool.acquire('projectile');
  if (proj) {
    Object.assign(proj, {
      x: pos.x, y: pos.y, target, tower,
      damage: baseDmg, damageType: cfg.damageType || 'physical',
      speed: cfg.projectileSpeed, splashRadius: tower.splashRadius,
      slowAmount: tower.slowAmount, slowDuration: tower.slowDuration,
      chainCount: tower.chainCount || 0, chainRange: tower.chainRange || 0,
      dotDamage: tower.dotDamage || 0, dotDuration: tower.dotDuration || 0,
      maxStacks: tower.maxStacks || 0, alive: true, type: tower.type,
      color: cfg.projectileColor, arcPath, arcProgress: 0,
      stunDuration: lvl.stunDuration || 0, defenseBreak: lvl.defenseBreak || 0,
      defenseBreakDuration: lvl.defenseBreakDuration || 0,
      confuseChance: lvl.confuseChance || 0, confuseDuration: lvl.confuseDuration || 0,
      splashDmgMult: tower.splashDmgMult || 1.0, chainNoDecay: tower.chainNoDecay || false,
      shieldBypass: tower.shieldBypass || false, ignoreResist: tower.ignoreResist || false,
      critChance: tower.critChance || 0, critMult: tower.critMult || 2.0,
      pierceCount: tower.pierceCount || 0, executeThreshold: tower.executeThreshold || 0,
      goldBonus: tower.goldBonus || 0, fearChance: tower.fearChance || 0,
      fearDuration: tower.fearDuration || 0, knockback: tower.knockback || 0,
      lifesteal: tower.lifesteal || 0, stackingDebuff: tower.stackingDebuff || 0,
      rampUpDmg: tower.rampUpDmg || 0, shatterChance: tower.shatterChance || 0,
      ricochet: tower.ricochet || 0,
    });
  } else {
    proj = {
      x: pos.x, y: pos.y, target, tower,
      damage: baseDmg, damageType: cfg.damageType || 'physical',
      speed: cfg.projectileSpeed, splashRadius: tower.splashRadius,
      slowAmount: tower.slowAmount, slowDuration: tower.slowDuration,
      chainCount: tower.chainCount || 0, chainRange: tower.chainRange || 0,
      dotDamage: tower.dotDamage || 0, dotDuration: tower.dotDuration || 0,
      maxStacks: tower.maxStacks || 0, alive: true, type: tower.type,
      color: cfg.projectileColor, arcPath, arcProgress: 0,
      stunDuration: lvl.stunDuration || 0, defenseBreak: lvl.defenseBreak || 0,
      defenseBreakDuration: lvl.defenseBreakDuration || 0,
      confuseChance: lvl.confuseChance || 0, confuseDuration: lvl.confuseDuration || 0,
      splashDmgMult: tower.splashDmgMult || 1.0, chainNoDecay: tower.chainNoDecay || false,
      shieldBypass: tower.shieldBypass || false, ignoreResist: tower.ignoreResist || false,
      critChance: tower.critChance || 0, critMult: tower.critMult || 2.0,
      pierceCount: tower.pierceCount || 0, executeThreshold: tower.executeThreshold || 0,
      goldBonus: tower.goldBonus || 0, fearChance: tower.fearChance || 0,
      fearDuration: tower.fearDuration || 0, knockback: tower.knockback || 0,
      lifesteal: tower.lifesteal || 0, stackingDebuff: tower.stackingDebuff || 0,
      rampUpDmg: tower.rampUpDmg || 0, shatterChance: tower.shatterChance || 0,
      ricochet: tower.ricochet || 0,

    const skipMoveThis = skipMove && proj.type !== 'sniper' && !proj._lostTarget;

        proj._lostTime = 0;
      }
    }

    if (proj._lostTarget) {

      const dy = proj._lostY - proj.y;

          // Splash projectile: still explode at impact point

          const tower = proj.tower;

function applyConfuse(enemy, duration) {

    // Disable towers in range
    for (const t of gameState.towers) {
      const d = dist(enemy, gridToPixel(t.col, t.row));
      if (d <= enemy.deathRange * CELL_SIZE) {
        t.disabled = true;
        t.disabledTimer = enemy.deathDuration || 3;
        spawnFloatingText(gridToPixel(t.col,t.row).x, gridToPixel(t.col,t.row).y - 8, '💥', '#ff9800');
      }
    }
    // Also damage nearby towers
    const dmg = Math.floor(enemy.maxHp * 0.3);
    for (const t of gameState.towers) {
      const d = dist(enemy, gridToPixel(t.col, t.row));
      if (d <= enemy.deathRange * CELL_SIZE * 0.7) {
        damageTower(t, dmg);
      }
    }
    spawnHitParticles(enemy.x, enemy.y, '#ff5722');
    spawnHitParticles(enemy.x, enemy.y, '#ff9800');
  }

  if (enemy.deathEffect === 'trap') {
    // Leave a trap that disables towers
    const trapDur = enemy.deathDuration || 3;
    gameState._traps = gameState._traps || [];
    gameState._traps.push({x: enemy.x, y: enemy.y, timer: trapDur + 3, disableTimer: trapDur});
  }

  if (enemy.deathEffect === 'parasite' && tower) {
    // Disable the tower that killed it
    tower.disabled = true;
    tower.disabledTimer = enemy.deathDuration || 3;
    spawnFloatingText(gridToPixel(tower.col,tower.row).x, gridToPixel(tower.col,tower.row).y - 8, '🐛寄生!', '#8bc34a');
  }

  // Retaliate slow (冰霜刺猬)
  if (enemy.retaliateSlow > 0 && tower) {
    tower.attackCooldown = tower.attackCooldown * 1.5;
    tower._retaliateSlowTimer = 2.0;
    tower._origAttackCd = getTowerLevelConfig(tower).cooldown;
    spawnFloatingText(gridToPixel(tower.col,tower.row).x, gridToPixel(tower.col,tower.row).y - 8, '❄减速!', '#2196f3');
  }
}

// ═══════════ 粒子与特效 ═══════════
function spawnHitParticles(x, y, color) {
  for (let i = 0; i < 5; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 30 + Math.random() * 60;
    const p = ObjectPool.acquire('particle') || {};
    Object.assign(p, {
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.3 + Math.random() * 0.3,
      maxLife: 0.6, color, size: 2 + Math.random() * 2, alive: true,
    });
    gameState.particles.push(p);
  }
}

function spawnDeathParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 100;
    const p = ObjectPool.acquire('particle') || {};
    Object.assign(p, {
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.4 + Math.random() * 0.5,
      maxLife: 0.9, color, size: 2 + Math.random() * 4, alive: true,
    });
    gameState.particles.push(p);
  }
}

function spawnFloatingText(x, y, text, color, isDmg) {
  // Only filter damage numbers based on display mode; always show gold/heal/combo/etc.
  if (isDmg && gameState._dmgDisplayMode === 'off') return;
  const ft = ObjectPool.acquire('floatText') || {};
  Object.assign(ft, { x, y, text, color, life: 0.8, maxLife: 0.8, alive: true, isDmg: !!isDmg });
  gameState.floatingTexts.push(ft);
}

function updateSplashFX(dt) {
  if (!gameState._splashFX) return;
  for (const fx of gameState._splashFX) {
    fx.life -= dt;
  }
  _removeDead(gameState._splashFX, fx => fx.life > 0);
}

function updateTraps(dt) {
  if (!gameState._traps) return;
  for (const trap of gameState._traps) {
    trap.timer -= dt;
    if (trap.timer <= 0) continue;
    // check if any enemy walks into the trap
    for (const enemy of gameState.enemies) {
      if (!enemy.alive) continue;
      if (distSq(enemy, trap) < (CELL_SIZE * 0.8) * (CELL_SIZE * 0.8)) {
        // trigger trap: disable towers in range
        for (const t of gameState.towers) {
          const d = dist(trap, gridToPixel(t.col, t.row));
          if (d <= CELL_SIZE * 2.5) {
            t.disabled = true;
            t.disabledTimer = trap.disableTimer;
          }
        }
        spawnHitParticles(trap.x, trap.y, '#795548');
        trap.timer = 0; // consumed
        break;
      }
    }
  }
  _removeDead(gameState._traps, t => t.timer > 0);
}

function updateGuards(dt) {
  for (const guard of gameState.guards) {
    if (!guard.alive) continue;
    // Guards are permanent; die only from enemy damage
    const towerPos = gridToPixel(guard.tower.col, guard.tower.row);
    const towerRange = guard.tower.range * CELL_SIZE;
    // 圣骑士 heal aura: heal nearby allied guards
    if (guard.tower.guardHealAura && guard.tower.guardHealAmount > 0) {
      guard._healCooldown = (guard._healCooldown || 0) - dt;
      if (guard._healCooldown <= 0) {
        guard._healCooldown = 0.8;
        const healPx = CELL_SIZE * 2.0;
        const healAmt = guard.tower.guardHealAmount;
        for (const other of gameState.guards) {
          if (!other.alive || other === guard) continue;
          if (other.hp >= other.maxHp) continue;
          if (distSq(guard, other) <= healPx * healPx) {
            other.hp = Math.min(other.maxHp, other.hp + healAmt);
          }
        }
      }
    }
    // Guard rally: nearby guards buff each other's damage
    if (guard.tower.guardRallyDmg > 0) {
      let nearbyGuards = 0;
      for (const other of gameState.guards) {
        if (!other.alive || other === guard) continue;
        if (distSq(guard, other) < (CELL_SIZE * 2.0) * (CELL_SIZE * 2.0)) nearbyGuards++;
      }
      guard._rallyBonus = Math.min(nearbyGuards, 5) * guard.tower.guardRallyDmg;
    } else {
      guard._rallyBonus = 0;
    }
    let bestEnemy = guard.target; if (!bestEnemy || !bestEnemy.alive) bestEnemy = null;
    let bestScore = -1; const ct = bestEnemy;
    for (const e of gameState.enemies) { if (!e.alive || e._burrowed) continue; const dSq3=distSq(guard,e); if(dSq3>towerRange*towerRange)continue;
      const d=Math.sqrt(dSq3); const ds=Math.max(0,1-d/towerRange)*40, hs=(e.maxHp/200)*30, ic=(e===ct)?20:0;
      const score=ds+hs+ic; if(score>bestScore){bestScore=score;bestEnemy=e;} }
    guard.target = bestEnemy;
    if (guard.target) {
      const dx = guard.target.x - guard.x;
      const dy = guard.target.y - guard.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      const spd = guard.speed;
      if (d > 5) { guard.x += (dx/d) * spd * dt; guard.y += (dy/d) * spd * dt; }
      else {
        // melee attack + BLOCK enemy (mutual combat, guard locked on target)
        guard.attackTimer -= dt;
        if (guard.attackTimer <= 0) {
          guard.attackTimer = 1.0;
          // Rally bonus damage
          const rallyMult = 1 + (guard._rallyBonus || 0);
          const guardDmg = Math.floor(guard.damage * rallyMult);
          // Execute threshold (巡逻队) - excludes boss and elite
          if (guard.tower.executeThreshold > 0 && guard.target.type !== 'boss' && guard.target.type !== 'elite'
              && guard.target.hp <= guard.target.maxHp * guard.tower.executeThreshold) {
            guard.target.hp = 0;
            spawnFloatingText(guard.target.x, guard.target.y - guard.target.size, '💀处决!', '#ff1744');
            killEnemy(guard.target, guard.tower);
            guard.target = null;
          } else {
            damageEnemy(guard.target, guardDmg, guard.tower, 'physical');
            spawnFloatingText(guard.target.x, guard.target.y - guard.target.size, `-${guardDmg}`, '#ff9800');
          }
          // Guard counter (圣骑士): reflect portion of damage
          if (guard.tower.guardCounter && guard.target) {
            const counterDmg = Math.floor(guard.target.maxHp * 0.02);
            guard.target.hp -= counterDmg;
            spawnFloatingText(guard.target.x, guard.target.y - guard.target.size - 8, '⚔反伤!' + counterDmg, '#ffd740');
          }
          // Enemy fights back: guard takes damage proportional to enemy strength
          if (guard.target && guard.target.alive) {
            let enemyAtk = Math.max(4, Math.floor(guard.target.maxHp * 0.03));
            // Guard shield absorbs damage
            if (guard.shield > 0) {
              if (guard.shield >= enemyAtk) {
                guard.shield -= enemyAtk;
                enemyAtk = 0;
              } else {
                enemyAtk -= guard.shield;
                guard.shield = 0;
              }
            }
            guard.hp -= enemyAtk;
            if (guard.hp <= 0) {
              guard.alive = false;
              if (guard.target) guard.target._blockedByGuard = false;
            }
          }
        }
        // PHYSICAL BLOCK + TAUNT: enemy cannot move past the guard
        if (guard.target) guard.target._blockedByGuard = true;
        // Taunt: force enemies to target this guard (皇家卫)
        if (guard.tower.guardTaunt) {
          for (const otherGuard of gameState.guards) {
            if (!otherGuard.alive || otherGuard === guard) continue;
            if (otherGuard.target === guard.target) otherGuard.target = null;
          }
        }
      }
    } else {
      // patrol: sweep around tower perimeter
      guard.patrolAngle = (guard.patrolAngle || 0) + dt * 1.2;
      const r = CELL_SIZE * 1.8;
      guard.x = towerPos.x + Math.cos(guard.patrolAngle) * r;
      guard.y = towerPos.y + Math.sin(guard.patrolAngle) * r;
    }
  }
}

function updateParticles(dt) {
  for (const p of gameState.particles) {
    if (!p.alive) continue;
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 40 * dt; // gravity
    if (p.life <= 0) p.alive = false;
  }
}

function updateFloatingTexts(dt) {
  for (const ft of gameState.floatingTexts) {
    if (!ft.alive) continue;
    ft.life -= dt;
    ft.y -= 30 * dt;
    if (ft.life <= 0) ft.alive = false;
  }
}

// In-place removal helper - avoids array allocation (filter() creates new arrays every frame)
function _removeDead(arr, aliveCheck, poolType) {
  let writeIdx = 0;
  for (let i = 0; i < arr.length; i++) {
    const item = arr[i];
    if (aliveCheck(item)) {
      if (writeIdx !== i) arr[writeIdx] = item;
      writeIdx++;
    } else if (poolType) {
      ObjectPool.release(poolType, item);
    }
  }
  arr.length = writeIdx;
}
function cleanupEntities() {
  _removeDead(gameState.enemies, e => e.alive, 'enemy');
  _removeDead(gameState.projectiles, p => p.alive, 'projectile');
  _removeDead(gameState.particles, p => p.alive, 'particle');
  _removeDead(gameState.floatingTexts, f => f.alive, 'floatText');
  _removeDead(gameState.guards, g => g.alive, 'guard');
  if (gameState._splashFX) _removeDead(gameState._splashFX, fx => fx.life > 0);
}

function generateWaveEnemies(waveNum) {
  const queue = [];
  const isEndless = waveNum > 50;

  if (waveNum % 10 === 0) {
    // Boss wave every 10 waves
    const bossCount = Math.ceil(waveNum / 10);
    for (let b = 0; b < bossCount; b++) queue.push({type: 'boss'});
    const extraCount = 3 + waveNum;
    for (let i = 0; i < extraCount; i++) {
      queue.push({type: weightedRandomType(waveNum)});
    }
  } else if (waveNum % 5 === 0) {
    // Mini-boss wave every 5 waves
    queue.push({type: 'boss'});
    const extraCount = 4 + waveNum;
    for (let i = 0; i < extraCount; i++) {
      queue.push({type: weightedRandomType(waveNum)});
    }
  } else {
    const baseCount = isEndless
      ? 5 + 50 * 2 + Math.floor((waveNum - 50) * 1.5)
      : 5 + waveNum * 2;

    // Force variety mix
    let forcedTypes;
    if (isEndless) {
      forcedTypes = ['normal','fast','tank','elite','shielded','healer','berserker','regen','phantom','armored','saboteur',
        'spikepig','windwolf','rhino','shaman','owl','parasite','skeleton','exploder','banshee','scout','irontank',
        'boomer','steelwolf','goblin','thief','shadow','ninja','smoker','hypnotist','gargoyle','skeletonArcher',
        'necromancer','wraith','repairdrone','empr','missile','portal','nanoswarm','fireelem','icehedge','storm',
        'sandgiant','watersplit','lavahound','arcane','elemental','larva','mosquito','beetle','toxant','hiveguard',
        'devourer','brainbug','locust','flagbearer','archon','mirror','parrot','tentacle','bear','pangolin','wolfking','timechief',
        'golem','assassin','druid','mimic','slime','warlock'];
      if (waveNum % 3 === 0) forcedTypes.push('splitter');
      if (waveNum % 4 === 0) forcedTypes.push('summoner');
      if (waveNum % 5 === 0) forcedTypes.push('swarm');
    } else if (waveNum <= 3) {
      forcedTypes = ['normal'];
    } else if (waveNum <= 6) {
      forcedTypes = ['normal','fast','windwolf','skeleton','larva','mosquito'];
    } else if (waveNum <= 10) {
      forcedTypes = ['normal','fast','tank','rhino','spikepig','exploder','windwolf','scout','thief','goblin'];
    } else if (waveNum <= 18) {
      forcedTypes = ['normal','fast','tank','elite','shielded','armored','saboteur','bear','skeletonArcher','steelwolf',
        'fireelem','sandgiant','beetle','toxant','devourer','shadow','ninja','smoker','flagbearer','irontank','boomer',
        'parasite','owl','shaman','wolfking','banshee','gargoyle','repairdrone','empr','golem','mimic'];
    } else if (waveNum <= 30) {
      forcedTypes = ['normal','fast','tank','elite','shielded','healer','berserker','regen','saboteur','bear','pangolin',
        'skeletonArcher','necromancer','gargoyle','steelwolf','fireelem','sandgiant','watersplit','lavahound','shadow',
        'ninja','thief','smoker','hypnotist','goblin','mosquito','hiveguard','brainbug','archon','missile','storm',
        'nanoswarm','arcane','elemental','parrot','tentacle','timechief','icehedge','locust','portal','golem','assassin','druid','mimic','slime','warlock'];
    } else {
      forcedTypes = ['normal','fast','tank','elite','shielded','healer','berserker','regen','phantom','armored','splitter',
        'summoner','saboteur','spikepig','windwolf','rhino','shaman','bear','owl','wolfking','pangolin','parasite',
        'skeleton','exploder','banshee','skeletonArcher','gargoyle','necromancer','wraith','scout','irontank',
        'repairdrone','empr','missile','boomer','portal','steelwolf','nanoswarm','fireelem','icehedge','storm',
        'sandgiant','watersplit','lavahound','arcane','elemental','larva','mosquito','beetle','toxant','hiveguard',
        'devourer','brainbug','locust','shadow','ninja','thief','smoker','hypnotist','timechief','goblin','parrot',
        'tentacle','flagbearer','archon','mirror','golem','assassin','druid','mimic','slime','warlock'];
    }

    const forced = [];
    for (const t of forcedTypes) {
      forced.push({type: t});
    }
    const remaining = baseCount - forced.length;
    for (let i = 0; i < Math.max(0, remaining); i++) {
      forced.push({type: weightedRandomType(waveNum)});
    }
    // Shuffle
    for (let i = forced.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [forced[i], forced[j]] = [forced[j], forced[i]];
    }
    return forced;
  }

  // Shuffle boss wave queue and assign paths
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  return queue;
}

function weightedRandomType(waveNum) {

  const w = isEndless ? 50 : waveNum;

  // Build weighted pool based on wave tier

  else if (w <= 6) { add('normal',5); add('fast',3); add('windwolf',2); add('skeleton',2); add('larva',2); add('mosquito',1); }
  else if (w <= 10) { add('normal',3); add('fast',2); add('tank',2); add('rhino',1); add('spikepig',1); add('exploder',1); add('scout',1); add('thief',1); add('goblin',1); }
  else if (w <= 18) { add('normal',2); add('fast',2); add('tank',2); add('elite',2); add('shielded',1); add('armored',1); add('saboteur',1); add('bear',1); add('steelwolf',1); add('fireelem',1); add('sandgiant',1); add('beetle',1); add('toxant',1); add('shadow',1); add('ninja',1); add('smoker',1); add('parasite',1); add('banshee',1); add('gargoyle',1); add('boomer',1); add('golem',1); add('mimic',1); }
  else if (w <= 30) { add('normal',1); add('fast',1); add('tank',1); add('elite',1); add('shielded',1); add('healer',1); add('berserker',1); add('regen',1); add('saboteur',1); add('bear',1); add('pangolin',1); add('necromancer',1); add('watersplit',1); add('lavahound',1); add('hypnotist',1); add('goblin',1); add('hiveguard',1); add('brainbug',1); add('archon',1); add('shadow',1); add('ninja',1); add('arcane',1); add('elemental',1); add('flagbearer',1); add('golem',1); add('assassin',1); add('druid',1); add('mimic',1); add('slime',1); add('warlock',1); }
  else { add('normal',1); add('fast',1); add('tank',1); add('elite',1); add('shielded',1); add('healer',1); add('berserker',1); add('regen',1); add('phantom',1); add('armored',1); add('splitter',1); add('summoner',1); add('saboteur',1); add('spikepig',1); add('windwolf',1); add('rhino',1); add('shaman',1); add('bear',1); add('owl',1); add('wolfking',1); add('pangolin',1); add('parasite',1); add('skeleton',1); add('exploder',1); add('banshee',1); add('skeletonArcher',1); add('gargoyle',1); add('necromancer',1); add('wraith',1); add('scout',1); add('irontank',1); add('repairdrone',1); add('empr',1); add('missile',1); add('boomer',1); add('steelwolf',1); add('nanoswarm',1); add('fireelem',1); add('icehedge',1); add('storm',1); add('sandgiant',1); add('watersplit',1); add('lavahound',1); add('arcane',1); add('elemental',1); add('larva',1); add('mosquito',1); add('beetle',1); add('toxant',1); add('hiveguard',1); add('devourer',1); add('brainbug',1); add('locust',1); add('shadow',1); add('ninja',1); add('thief',1); add('smoker',1); add('hypnotist',1); add('timechief',1); add('goblin',1); add('parrot',1); add('tentacle',1); add('flagbearer',1); add('archon',1); add('mirror',1); add('portal',1); add('golem',1); add('assassin',1); add('druid',1); add('mimic',1); add('slime',1); add('warlock',1); }
  return pool[Math.floor(Math.random() * pool.length)] || 'normal';
}

function startWave() {
  if (gameState.phase !== 'build') return;
  if (gameState.wave >= gameState.maxWaves && gameState.wave < 50) return;

  gameState.wave++;
  gameState._firstTowerPlacedThisWave = false;
  gameState.phase = 'combat';
  gameState.waveSpawnQueue = generateWaveEnemies(gameState.wave);
  gameState.wavePreview = summarizeWave(gameState.waveSpawnQueue);
  gameState.spawnTimer = 0;
  gameState.enemiesAlive = 0;
  gameState.comboCount = 0;
  gameState.comboTimer = 0;
  gameState._passiveGoldAcc = 0;
  // Keep tower selections active during combat so player can keep building
  gameState.hintText = `第 ${gameState.wave} 波开始！(仍可建造)`;
  AudioFX.waveStart();
}

function summarizeWave(queue) {
  const counts = {};
  for (const e of queue) counts[e.type] = (counts[e.type] || 0) + 1;
  return {counts, total: queue.length};
}

function updateSpawning(dt) {
  if (gameState.waveSpawnQueue.length === 0) return;

  gameState.spawnTimer -= dt;
  if (gameState.spawnTimer <= 0) {
    const config = gameState.waveSpawnQueue.shift();
    createEnemy(config);
    gameState.spawnTimer = SPAWN_INTERVAL;
  }
}


function checkWaveComplete() {
  if (gameState.phase !== 'combat') return;
  if (gameState.waveSpawnQueue.length > 0 || gameState.enemiesAlive > 0) return;

  // Release objects to pool before clearing
  for (const p of gameState.projectiles) ObjectPool.release('projectile', p);
  for (const p of gameState.particles) ObjectPool.release('particle', p);
  for (const f of gameState.floatingTexts) ObjectPool.release('floatText', f);
  gameState.projectiles = [];
  gameState.particles = [];
  gameState.floatingTexts = [];
  gameState._splashFX = [];
  // Tech point reward: 1 + floor(wave/5) per wave
  const waveTP = 1 + Math.floor(gameState.wave / 5) + Math.floor(getTechBonus('waveTP'));
  addTechPoints(waveTP);
  gameState._comboTPGiven = 0; // reset combo TP counter per wave
  // heal all towers
  for (const t of gameState.towers) t.hp = t.maxHp;
  // Auto-save on idle to avoid stutter (only if not game over)
  if (gameState.lives > 0) {
    if (typeof requestIdleCallback !== 'undefined') {
      requestIdleCallback(() => { try { saveGame(); } catch(e) {} });
    } else {
      setTimeout(() => { try { saveGame(); } catch(e) {} }, 200);
    }
  }
  gameState._saveDetected = {wave: gameState.wave, timeAgo: '刚刚'};
  let bonus = 50 + gameState.wave * 10;
  bonus = Math.floor(bonus * (1 + getTechBonus('waveBonus')));
  // Interest on gold
  const interestRate = getTechBonus('interest');
  if (interestRate > 0) {
    const interest = Math.floor(gameState.gold * interestRate);
    gameState.gold += interest;
  }
  gameState.gold += bonus;
  gameState.score += bonus;

  if (gameState.wave === 50) {
    // Beat the game! Show victory, click to continue into endless
    gameState.phase = 'victory';
    gameState.hintText = '恭喜通关50波！点击进入无尽模式';
    AudioFX.victory();
  } else if (gameState.wave > 50) {
    // Endless mode: keep going
    gameState.phase = 'build';
    gameState.hintText = `无尽模式 第${gameState.wave}波完成！获得 ${bonus} 金币`;
  } else {
    gameState.phase = 'build';
    gameState.hintText = `波次完成！获得 ${bonus} 金币奖励`;
  }
}

function checkGameOver() {
  if (gameState.lives <= 0) {
    gameState.lives = 0;
    gameState.phase = 'gameover';
    gameState.hintText = '游戏结束';
    AudioFX.gameOver();
  }
}

// ═══════════ 输入处理 ═══════════
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  gameState.mouseX = (e.clientX - rect.left) * scaleX;
  gameState.mouseY = (e.clientY - rect.top) * scaleY;

  const grid = pixelToGrid(gameState.mouseX, gameState.mouseY);
  gameState.hoveredCell = grid;

  if (gameState.selectedTowerType && grid && !gameState._techPanelOpen) {
    const cellVal = gameState.grid[grid.row][grid.col];
    const cfg = TOWER_CONFIG[gameState.selectedTowerType];
    if (cellVal >= 1 && cellVal <= 3) {
      gameState.hintText = '不能放在怪物路径上';
    } else if (cellVal >= 10) {
      gameState.hintText = '该位置已有塔，无法建造';
    } else if (gameState.gold < cfg.cost) {
      gameState.hintText = '金币不足，无法建造 (' + cfg.cost + '金)';
    } else {
      gameState.hintText = '点击放置塔 (' + cfg.name + ' ' + cfg.cost + '金)';
    }
  }
  // debug info
  gameState._debugInfo = grid ? ('格('+grid.col+','+grid.row+') 值:'+(gameState.grid[grid.row]?.[grid.col]??'?')) : '地图外';
});

canvas.addEventListener('click', (e) => {
  gameState._lastClick = {x: gameState.mouseX, y: gameState.mouseY, time: Date.now()};

  // Check left sidebar save/load buttons (always visible)
  const mx0 = gameState.mouseX, my0 = gameState.mouseY;
  if (gameState._leftSaveBtn) {
    const b = gameState._leftSaveBtn;
    if (mx0 >= b.x && mx0 <= b.x + b.w && my0 >= b.y && my0 <= b.y + b.h) { saveGame(); return; }
  }
  if (gameState._leftLoadBtn) {
    const b = gameState._leftLoadBtn;
    if (mx0 >= b.x && mx0 <= b.x + b.w && my0 >= b.y && my0 <= b.y + b.h) { if (hasSave()) loadGame(); else gameState.hintText = '没有存档数据'; return; }
  }
  // Float text toggle (sidebar or top bar)
  const floatBtns = [gameState._floatToggleBtn, gameState._topSettingsBtn, gameState._techDmgBtn].filter(Boolean);
  for (const b2 of floatBtns) {
    if (mx0 >= b2.x && mx0 <= b2.x + b2.w && my0 >= b2.y && my0 <= b2.y + b2.h) {
      const modes = ['off', 'single', 'total'];
      const idx = modes.indexOf(gameState._dmgDisplayMode);
      gameState._dmgDisplayMode = modes[(idx + 1) % 3];
      const labels = {off: '伤害显示: 关', single: '伤害显示: 单个', total: '伤害显示: 累积'};
      gameState.hintText = labels[gameState._dmgDisplayMode];
      return;
    }
  }

  if (gameState._techPanelOpen) {
    const mx = gameState.mouseX, my = gameState.mouseY;
    // Check tech node buttons
    if (gameState._techNodeBtns) {
      for (const btn of gameState._techNodeBtns) {
        if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
          gameState._techSelected = {branch: btn.branch, id: btn.nodeId};
          if (upgradeTechNode(btn.branch, btn.nodeId)) {
            refreshAllTowerTech();
          }
          return;
        }
      }
    }
    // Click outside panel closes it
    const b = gameState._techPanelBounds;
    if (b && (mx < b.x || mx > b.x + b.w || my < b.y || my > b.y + b.h)) {
      gameState._techPanelOpen = false;
      gameState._techNodeBtns = [];
    }
    return;
  }

  if (gameState.phase === 'gameover' || gameState.phase === 'victory') {
    handleOverlayClick();
    return;
  }

  const mx = gameState.mouseX;
  const my = gameState.mouseY;

  // check side panel tower buttons
  if (gameState._towerBtns) {
    for (const btn of gameState._towerBtns) {
      if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
        gameState.selectedTowerType = (gameState.selectedTowerType === btn.type) ? null : btn.type;
        gameState.selectedPlacedTower = null;
        gameState.hintText = gameState.selectedTowerType
          ? `已选择${TOWER_CONFIG[btn.type].name}，点击地图放置`
          : '选择塔类型，点击地图放置';
        return;
      }
    }
  }

  // check branch upgrade buttons
  if (gameState._upgradeBtns && gameState._upgradeBtns.length > 0 && gameState.selectedPlacedTower) {
    for (const btn of gameState._upgradeBtns) {
      if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
        upgradeTower(gameState.selectedPlacedTower, btn.branchIdx);
        return;
      }
    }
  }

  // check sell button
  if (gameState._sellBtn && gameState.selectedPlacedTower) {
    const btn = gameState._sellBtn;
    if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
      sellTower(gameState.selectedPlacedTower);
      return;
    }
  }

  // check start wave button
  if (gameState._startBtn) {
    const btn = gameState._startBtn;
    if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
      startWave();
      return;
    }
  }

  // check speed button
  if (gameState._speedBtn) {
    const btn = gameState._speedBtn;
    if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
      gameState.speedMultiplier = gameState.speedMultiplier >= 4 ? 1 : gameState.speedMultiplier + 1;
      return;
    }
  }

  // check tech panel button
  if (gameState._techPanelBtn) {
    const btn = gameState._techPanelBtn;
    if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
      gameState._techPanelOpen = !gameState._techPanelOpen;
      gameState._techNodeBtns = [];
      gameState._techSelected = null;
      return;
    }
  }

  // check map click
  const grid = pixelToGrid(mx, my);
  gameState._lastGrid = grid;
  if (!grid) { gameState._debugClickResult = '点击在地图外(x=' + Math.round(mx) + ')'; return; }

  // Map editor mode
  if (gameState._mapEditMode) {
    const wps = gameState._mapEditWaypoints;
    // Right-click: remove last point
    if (e.button === 2) {
      wps.pop();
      gameState.hintText = '已删除最后一点，剩余 ' + wps.length + ' 个点';
      return;
    }
    // Check if clicking existing point to remove it
    for (let i = 0; i < wps.length; i++) {
      if (wps[i].col === grid.col && wps[i].row === grid.row) {
        wps.splice(i, 1);
        gameState.hintText = '已删除点(' + grid.col + ',' + grid.row + ')，剩余 ' + wps.length + ' 个点';
        return;
      }
    }
    wps.push({col: grid.col, row: grid.row});
    gameState.hintText = '添加点(' + grid.col + ',' + grid.row + ')，共 ' + wps.length + ' 个 | 按M导出';
    return;
  }

  // placing tower
  if (gameState.selectedTowerType) {
    const placingType = gameState.selectedTowerType;
    const cfg = TOWER_CONFIG[placingType];
    let result = false;
    try {
      result = placeTower(grid.col, grid.row, placingType);
    } catch(e) {
      gameState._debugClickResult = '❌异常:' + e.message;
      console.error('placeTower error:', e);
    }
    if (!gameState._debugClickResult || gameState._debugClickResult.indexOf('异常') === -1) {
      gameState._debugClickResult = '放置' + cfg.name + '于(' + grid.col + ',' + grid.row + ') 结果:' + (result ? '成功✅' : '失败❌') + ' 金:' + gameState.gold;
    }
    if (!result) {
      if (gameState.gold < cfg.cost) {
        gameState.hintText = '金币不足！需要 ' + cfg.cost + ' 金';
      } else if (gameState.grid[grid.row][grid.col] >= 10) {
        gameState.hintText = '该位置已有塔';
      } else {
        gameState.hintText = '无法在此处建造';
      }

  }

  // check if clicking an existing tower
  for (const tower of gameState.towers) {
    if (tower.col === grid.col && tower.row === grid.row) {
      gameState.selectedPlacedTower = (gameState.selectedPlacedTower === tower) ? null : tower;
      gameState.selectedTowerType = null;
      gameState.hintText = gameState.selectedPlacedTower
        ? `已选中${TOWER_CONFIG[tower.type].name} · ${getTowerLevelConfig(tower).name}`
        : '选择塔类型，点击地图放置';
      return;
    }
  }

  // clicked empty/other area
  gameState.selectedPlacedTower = null;
});
